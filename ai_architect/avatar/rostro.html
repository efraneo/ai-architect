<script>window.DATOS_ARQUITECTO = null; /* __DATOS__ */</script>

<script>
// =========================================================
// Una nebulosa que forma un rostro
//
// El intento anterior eran puntos sobre una esfera: se leia
// como una malla, no como una cara. Un rostro humano no se
// reconoce por el contorno sino por **como le da la luz** —
// el pomulo encendido, la cuenca en sombra, el lado oscuro
// de la nariz—. Asi que cada particula calcula su propia
// normal sobre la superficie de la cara y se ilumina; el
// volumen sale de ahi, no del dibujo.
//
// Y para que sea nebulosa y no puntitos: mucha particula
// grande, blanda y casi transparente por detras, poca y
// brillante delante, todo sumandose. La niebla la hacen las
// blandas; la cara, las brillantes.
//
// Nada de esto se anima al azar. Cuando habla, la mandibula
// y los labios siguen las **silabas reales** del texto, que
// Python le pasa junto con la duracion exacta del audio.
// =========================================================

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d", { alpha: false });
const rotulo = document.getElementById("estado");
const pie = document.getElementById("pie");

let ultimaFuente = "";

const CAMARA = 1.62;
const LENTE = 2.3;

let ancho = 0, alto = 0, escala = 0, pixeles = 1;

function medir() {
  pixeles = Math.min(window.devicePixelRatio || 1, 2);
  ancho = window.innerWidth;
  alto = window.innerHeight;

  lienzo.width = ancho * pixeles;
  lienzo.height = alto * pixeles;
  lienzo.style.width = ancho + "px";
  lienzo.style.height = alto + "px";

  ctx.setTransform(pixeles, 0, 0, pixeles, 0, 0);
  escala = Math.min(ancho, alto * 0.82) * 0.46;
}

window.addEventListener("resize", medir);
medir();

// --- Paleta -----------------------------------------------------------------
//
// Los halos se pintan una vez y luego se estampan escalados. `shadowBlur`
// por particula, a seis mil particulas y sesenta fotogramas, no llega.

function halo(r, g, b, dureza) {
  const hoja = document.createElement("canvas");
  hoja.width = hoja.height = 96;

  const pincel = hoja.getContext("2d");
  const grad = pincel.createRadialGradient(48, 48, 0, 48, 48, 48);

  // `dureza` alta => nucleo apretado y brillante (una chispa).
  // `dureza` baja => se desvanece despacio (gas).
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const a = Math.pow(1 - t, dureza);

    grad.addColorStop(t, "rgba(" + r + "," + g + "," + b + "," + a.toFixed(3) + ")");
  }

  pincel.fillStyle = grad;
  pincel.fillRect(0, 0, 96, 96);

  return hoja;
}

// De lo mas hondo y frio a lo mas encendido. El indice lo decide la luz
// que recibe cada particula, asi que la paleta *es* el sombreado.
const PALETA = [
  halo(58, 34, 116, 1.5),     // 0  polvo violeta del fondo
  halo(78, 52, 168, 1.8),     // 1  penumbra
  halo(70, 96, 214, 2.1),     // 2  azul medio
  halo(86, 168, 236, 2.5),    // 3  azul claro
  halo(156, 214, 252, 3.0),   // 4  luz
  halo(236, 246, 255, 4.0),   // 5  alta luz
  halo(255, 168, 214, 3.2),   // 6  rosa de nebulosa (rebote calido)
];

const POLVO = halo(96, 62, 190, 1.2);
const ESTRELLA = halo(255, 255, 255, 5.0);

// --- La forma de una cara ---------------------------------------------------
//
// `perfil(x, y)` devuelve cuanto sobresale la cara en ese punto. Es la
// pieza central: de aqui salen la silueta, el relieve y la iluminacion.

function campana(d, s) {
  return Math.exp(-(d * d) / (2 * s * s));
}

function campana2(dx, dy, sx, sy) {
  return campana(dx, sx) * campana(dy, sy);
}

const ANCHO_CARA = 0.70;
const ALTO_CARA = 1.02;

function perfil(x, y) {
  const t = 1 - (x / ANCHO_CARA) ** 2 - (y / ALTO_CARA) ** 2;

  if (t <= 0) return null;                      // fuera del ovalo

  let z = Math.sqrt(t) * 0.60;

  // La frente es mas plana que una esfera; sin esto parece un globo.
  z -= campana(y - 0.66, 0.32) * 0.055;

  // Arco de las cejas.
  z += campana(y - 0.31, 0.095) * campana(x, 0.40) * 0.050;

  // Cuencas. Hundidas, que es lo que crea la sombra que lee el ojo.
  z -= (campana2(x - 0.295, y - 0.145, 0.185, 0.125) +
        campana2(x + 0.295, y - 0.145, 0.185, 0.125)) * 0.115;

  // Caballete de la nariz, de la ceja a la punta.
  z += campana(x, 0.070) * campana(y + 0.055, 0.30) * 0.185;

  // Punta y aletas.
  z += campana2(x, y + 0.285, 0.090, 0.070) * 0.115;
  z += (campana2(x - 0.105, y + 0.295, 0.050, 0.055) +
        campana2(x + 0.105, y + 0.295, 0.050, 0.055)) * 0.050;

  // Pomulos: lo que mas define una cara despues de la nariz.
  z += (campana2(x - 0.415, y + 0.015, 0.185, 0.215) +
        campana2(x + 0.415, y + 0.015, 0.185, 0.215)) * 0.048;

  // Surco entre nariz y labio.
  z -= campana2(x, y + 0.415, 0.075, 0.045) * 0.022;

  // Labios.
  z += campana2(x, y + 0.520, 0.225, 0.070) * 0.072;

  // Hueco bajo el labio inferior, y barbilla.
  z -= campana2(x, y + 0.665, 0.150, 0.048) * 0.032;
  z += campana2(x, y + 0.800, 0.180, 0.120) * 0.052;

  return z;
}

// La normal, por diferencias finitas. Es aproximada y da igual: lo unico
// que tiene que hacer es decidir si un punto mira hacia la luz o no.
const PASO = 0.02;

const LUZ = (function () {
  const v = [-0.42, 0.52, 0.78];
  const n = Math.hypot(v[0], v[1], v[2]);

  return [v[0] / n, v[1] / n, v[2] / n];
})();

function iluminacion(x, y, z) {
  const zx = perfil(x + PASO, y);
  const zy = perfil(x, y + PASO);

  if (zx === null || zy === null) return 0.30;

  const nx = -(zx - z) / PASO;
  const ny = -(zy - z) / PASO;
  const largo = Math.hypot(nx, ny, 1);

  const lum = (nx * LUZ[0] + ny * LUZ[1] + LUZ[2]) / largo;

  return Math.max(0, lum);
}

// --- Sembrar la nebulosa ----------------------------------------------------

const particulas = [];

// Donde la nebulosa se condensa. Un gas uniforme no forma una cara: hace
// falta que se apelotone justo en los rasgos.
function densidad(x, y) {
  let d = 0.34;

  d += campana(x, 0.075) * campana(y + 0.06, 0.30) * 0.55;          // nariz
  d += campana2(x, y + 0.285, 0.10, 0.085) * 0.60;                  // punta
  d += campana2(x, y + 0.520, 0.235, 0.070) * 0.85;                 // labios
  d += (campana2(x - 0.295, y - 0.145, 0.175, 0.105) +
        campana2(x + 0.295, y - 0.145, 0.175, 0.105)) * 0.75;       // ojos
  d += campana(y - 0.31, 0.075) * campana(x, 0.38) * 0.55;          // cejas
  d += campana2(x, y + 0.800, 0.185, 0.115) * 0.35;                 // barbilla

  // El borde del ovalo se difumina: asi la cara se deshace en gas por los
  // lados en vez de tener un recorte limpio.
  const r = Math.hypot(x / ANCHO_CARA, y / ALTO_CARA);

  d *= 1 - Math.pow(Math.min(1, r), 5) * 0.75;

  return d;
}

function sembrarRostro(cuantas) {
  let intentos = 0;

  while (particulas.length < cuantas && intentos < cuantas * 40) {
    intentos++;

    const x = (Math.random() * 2 - 1) * ANCHO_CARA;
    const y = (Math.random() * 2 - 1) * ALTO_CARA;

    const z = perfil(x, y);

    if (z === null) continue;
    if (Math.random() > densidad(x, y)) continue;

    const lum = iluminacion(x, y, z);

    // Un poco de grosor: la cara no es una cascara de papel.
    const grosor = (Math.random() - 0.5) * 0.055;

    particulas.push(nueva(x, y, z + grosor, lum, "cara"));
  }
}

function nueva(x, y, z, lum, clase) {
  // El brillo no es lineal: se exagera el contraste para que la sombra de
  // la cuenca y la luz del pomulo se separen de verdad.
  const brillo = Math.pow(lum, 1.45);

  // La mayoria son chispas pequenas; unas pocas, gas grande y blando.
  const gas = Math.random() < 0.20;

  let indice = Math.min(5, Math.floor(brillo * 6.2));

  // Un rebote calido en lo mas iluminado. Es lo que le quita el aire de
  // holograma azul y lo acerca a piel.
  if (brillo > 0.80 && Math.random() < 0.35) indice = 6;

  return {
    bx: x, by: y, bz: z,
    x: x, y: y, z: z,
    clase: clase,
    brillo: 0.16 + brillo * 0.92,
    indice: indice,
    gas: gas,
    tam: gas ? 2.4 + Math.random() * 2.6 : 0.55 + Math.random() * 0.95,
    fase: Math.random() * Math.PI * 2,
    vel: 0.25 + Math.random() * 0.55,
    vaiven: gas ? 0.055 : 0.014,
  };
}

function sembrarCraneo(cuantas) {
  // La nuca. Apenas se ve, pero sin ella la cara flota como una mascara.
  for (let i = 0; i < cuantas; i++) {
    const u = Math.random() * 2 - 1;
    const r = Math.sqrt(Math.max(0, 1 - u * u));
    const a = Math.random() * Math.PI * 2;

    const z = -Math.abs(Math.sin(a) * r) * 0.52 - 0.05;

    const p = nueva(
      Math.cos(a) * r * 0.66,
      u * 0.98,
      z,
      0.16 + Math.random() * 0.14,
      "craneo"
    );

    p.gas = true;
    p.tam = 2.0 + Math.random() * 2.8;
    p.indice = Math.random() < 0.6 ? 0 : 1;

    particulas.push(p);
  }
}

function sembrarBruma(cuantas) {
  // El gas que envuelve. Vive fuera de la cara y se mueve mas.
  for (let i = 0; i < cuantas; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.75 + Math.pow(Math.random(), 0.6) * 1.25;

    const p = nueva(
      Math.cos(a) * r * 0.95,
      Math.sin(a) * r * 0.80 + 0.05,
      (Math.random() - 0.5) * 0.9,
      0.10 + Math.random() * 0.20,
      "bruma"
    );

    p.gas = true;
    p.tam = 3.0 + Math.random() * 4.5;
    p.vaiven = 0.10;
    p.vel = 0.10 + Math.random() * 0.25;
    p.brillo *= 0.55;

    particulas.push(p);
  }
}

function sembrarEstrellas(cuantas) {
  for (let i = 0; i < cuantas; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 1.0 + Math.random() * 1.8;

    const p = nueva(
      Math.cos(a) * r,
      Math.sin(a) * r * 0.8,
      (Math.random() - 0.5) * 1.6,
      1,
      "estrella"
    );

    p.tam = 0.35 + Math.random() * 0.45;
    p.gas = false;
    p.brillo = 0.25 + Math.random() * 0.55;

    particulas.push(p);
  }
}

sembrarRostro(4600);
sembrarCraneo(750);
sembrarBruma(820);
sembrarEstrellas(170);

// Marcas por zona, para poder moverlas al hablar. Se calculan una vez.
for (const p of particulas) {
  if (p.clase !== "cara") continue;

  // Cuanto baja con la mandibula: nada en los pomulos, todo en la barbilla.
  p.mandibula = Math.max(0, Math.min(1, (-0.34 - p.by) / 0.70));

  p.labioAlto = campana2(p.bx, p.by + 0.470, 0.230, 0.055);
  p.labioBajo = campana2(p.bx, p.by + 0.585, 0.230, 0.065);

  // Lo que hay entre los labios: se apaga al abrir la boca, y ese hueco
  // negro es lo que se lee como boca abierta.
  p.interior = campana2(p.bx, p.by + 0.528, 0.170, 0.030);

  p.ceja = campana(p.by - 0.315, 0.075) * campana(p.bx, 0.36);

  p.ojo = campana2(p.bx - 0.295, p.by - 0.150, 0.170, 0.100) +
          campana2(p.bx + 0.295, p.by - 0.150, 0.170, 0.100);
}

// --- El guion: como se mueve la boca con lo que dice -------------------------
//
// Una boca que se abre y cierra al azar se nota falsa enseguida. Esta
// sigue las silabas del texto: la "a" abre mucho, la "i" poco, la "o"
// redondea, y una "m" o una "p" cierran del todo antes de sonar.

const ABERTURA = { a: 1.00, á: 1.00, e: 0.66, é: 0.66, o: 0.74, ó: 0.74,
                   i: 0.34, í: 0.34, u: 0.36, ú: 0.36, ü: 0.36 };

const REDONDEO = { o: 0.75, ó: 0.75, u: 1.00, ú: 1.00, ü: 1.00 };

const VOCALES = "aeiouáéíóúü";

function silabar(texto) {
  const trozos = [];
  const bajo = texto.toLowerCase();

  let consonante = "";

  for (let i = 0; i < bajo.length; i++) {
    const c = bajo[i];

    if (VOCALES.includes(c)) {
      let nucleo = "";

      while (i < bajo.length && VOCALES.includes(bajo[i])) nucleo += bajo[i++];

      i--;

      // De un diptongo manda la vocal mas abierta: en "cuan" se oye la a.
      let abre = 0, redondo = 0;

      for (const v of nucleo) {
        abre = Math.max(abre, ABERTURA[v] || 0.5);
        redondo = Math.max(redondo, REDONDEO[v] || 0);
      }

      trozos.push({
        abre: abre,
        redondo: redondo,
        cierra: "mbp".includes(consonante) ? 1 : "fvw".includes(consonante) ? 0.55 : 0.15,
        peso: 1,
      });

      consonante = "";

    } else if (/[a-zñáéíóúü]/.test(c)) {
      consonante = c;

    } else if (",;:".includes(c)) {
      trozos.push({ abre: 0, redondo: 0, cierra: 0, peso: 0.85, pausa: true });
      consonante = "";

    } else if (".!?".includes(c)) {
      trozos.push({ abre: 0, redondo: 0, cierra: 0, peso: 1.7, pausa: true });
      consonante = "";
    }
  }

  return trozos;
}

function guion(texto, ms) {
  const trozos = silabar(texto || "");

  if (!trozos.length) return [];

  const total = trozos.reduce((s, t) => s + t.peso, 0);

  let reloj = 0;

  for (const t of trozos) {
    t.desde = reloj;
    t.dura = (t.peso / total) * ms;
    reloj += t.dura;
  }

  return trozos;
}

// --- Estado ------------------------------------------------------------------

const estado = {
  modo: "reposo",
  apertura: 0, objetivoApertura: 0,
  redondeo: 0, objetivoRedondeo: 0,
  cejas: 0, objetivoCejas: 0,
  parpadeo: 0,
  proximoParpadeo: 2000,
  cabeceo: 0,
  giro: 0, inclina: 0,
  ratonX: 0, ratonY: 0,
  guion: [],
  empezo: 0,
  hasta: 0,
};

window.addEventListener("pointermove", function (e) {
  estado.ratonX = (e.clientX / window.innerWidth - 0.5) * 2;
  estado.ratonY = (e.clientY / window.innerHeight - 0.5) * 2;
});

const arquitecto = {
  hablar: function (ms, texto) {
    const duracion = ms || 2500;

    estado.modo = "hablando";
    estado.empezo = performance.now();
    estado.hasta = estado.empezo + duracion;
    estado.guion = guion(texto || "", duracion);

    rotulo.textContent = "hablando";
  },

  escuchar: function () {
    estado.modo = "escuchando";
    rotulo.textContent = "escuchando";
  },

  pensar: function () {
    estado.modo = "pensando";
    estado.guion = [];
    rotulo.textContent = "pensando";
  },

  reposo: function () {
    estado.modo = "reposo";
    estado.guion = [];
    rotulo.textContent = "en reposo";
  },
};

window.arquitecto = arquitecto;

addEventListener("keydown", function (e) {
  if (e.code !== "Space") return;

  e.preventDefault();

  arquitecto.hablar(
    4200,
    "Buenas tardes. Soy el arquitecto, y esta es mi voz."
  );
});

// Python inyecta los datos en el HTML antes de abrirlo. Por la URL no se
// puede: en Windows `webbrowser` acaba en `os.startfile`, el shell resuelve
// el file: como una ruta y ahi el '?' no es un caracter valido, asi que la
// query se perdia entera y la cara nunca se enteraba de que tenia que
// hablar. Se abria, giraba, y nada mas.
if (window.DATOS_ARQUITECTO && window.DATOS_ARQUITECTO.ms) {
  const datos = window.DATOS_ARQUITECTO;

  setTimeout(function () {
    arquitecto.hablar(datos.ms, datos.texto || "");
  }, datos.retraso || 250);
}

// --- La camara: que te siga a ti, no al raton ---------------------------------
//
// `getUserMedia` exige contexto seguro. `file://` no lo es y `localhost`
// si, que es la razon de que esto se sirva por HTTP en vez de abrirse como
// archivo. Sin servidor, esta parte entera no existe y se sigue el raton.
//
// No se carga ninguna libreria de vision. Con noventa y seis por setenta y
// dos pixeles bastan dos senales:
//
//   - **Movimiento**: la diferencia con el cuadro anterior. Una mano que
//     saluda la enciende entera, asi que si hay movimiento fuerte se
//     asume que es un gesto deliberado y manda sobre lo demas.
//   - **Piel**: el clasico umbral en RGB. Cuando estas quieto no hay
//     movimiento que seguir, pero tu cara sigue ahi.
//
// No es reconocimiento facial y no conviene llamarlo asi: es una mancha de
// color. Basta para que la cabeza te siga; para leer expresiones haria
// falta un modelo de verdad.

const camara = { activa: false, que: "raton", x: 0, y: 0 };

const MUESTRA_ANCHO = 96;
const MUESTRA_ALTO = 72;

// Cuanta diferencia acumulada cuenta como "alguien esta moviendo algo".
const UMBRAL_MOVIMIENTO = 26000;

const MINIMO_PIEL = 55;

async function encenderCamara() {
  if (!window.isSecureContext || !navigator.mediaDevices) return;

  let flujo;

  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240, facingMode: "user" },
      audio: false,
    });

  } catch (e) {
    return;                       // sin permiso se sigue con el raton
  }

  const video = document.createElement("video");

  video.srcObject = flujo;
  video.muted = true;
  video.playsInline = true;

  await video.play();

  const hoja = document.createElement("canvas");

  hoja.width = MUESTRA_ANCHO;
  hoja.height = MUESTRA_ALTO;

  const pincel = hoja.getContext("2d", { willReadFrequently: true });

  let anteriorCuadro = null;

  camara.activa = true;

  setInterval(function () {
    pincel.drawImage(video, 0, 0, MUESTRA_ANCHO, MUESTRA_ALTO);

    const cuadro = pincel.getImageData(0, 0, MUESTRA_ANCHO, MUESTRA_ALTO).data;

    mirar(cuadro, anteriorCuadro);

    anteriorCuadro = cuadro;
  }, 70);
}

function mirar(ahora, antes) {
  let mx = 0, my = 0, peso = 0;
  let px = 0, py = 0, piel = 0;

  for (let i = 0, n = 0; i < ahora.length; i += 4, n++) {
    const r = ahora[i], g = ahora[i + 1], b = ahora[i + 2];

    const x = n % MUESTRA_ANCHO;
    const y = (n / MUESTRA_ANCHO) | 0;

    if (antes) {
      const d = Math.abs(r - antes[i]) +
                Math.abs(g - antes[i + 1]) +
                Math.abs(b - antes[i + 2]);

      if (d > 58) { mx += x * d; my += y * d; peso += d; }
    }

    const mayor = Math.max(r, g, b);
    const menor = Math.min(r, g, b);

    if (r > 95 && g > 40 && b > 20 && mayor - menor > 15 && r - g > 15 && r > b) {
      px += x; py += y; piel++;
    }
  }

  let cx, cy, que;

  if (peso > UMBRAL_MOVIMIENTO) {
    cx = mx / peso; cy = my / peso; que = "tu mano";

  } else if (piel > MINIMO_PIEL) {
    cx = px / piel; cy = py / piel; que = "tu cara";

  } else {
    camara.que = "buscandote";

    return;
  }

  // Espejo en horizontal: si te mueves a tu derecha, la cara mira hacia
  // alli. Sin invertir se siente al reves y desconcierta.
  const destinoX = -((cx / MUESTRA_ANCHO) - 0.5) * 2;
  const destinoY = ((cy / MUESTRA_ALTO) - 0.5) * 2;

  // Suavizado fuerte: la senal de una camara es ruidosa y una cabeza que
  // tirita no parece que te mire, parece que le pasa algo.
  camara.x += (destinoX - camara.x) * 0.16;
  camara.y += (destinoY - camara.y) * 0.16;
  camara.que = que;
}

encenderCamara();

// --- El oido: hablarle en vez de escribirle ----------------------------------
//
// Hasta aqui la cara veia pero no oia, y eso no se nota hasta que alguien
// se pone a hablarle delante y no pasa nada.
//
// Se usa el reconocimiento del propio navegador. Conviene decir lo que
// implica: **Chrome manda el audio a los servidores de Google** para
// transcribirlo. No es local. La alternativa es grabar aqui y transcribir
// con Whisper desde Python — mas privado respecto a Google, aunque el
// audio acabe igualmente en OpenAI, y de pago.
//
// Lo que se oye se escribe en pantalla siempre. Si entiende otra cosa, se
// ve al momento; sin eso, "no me escucha" y "te oyo mal" son lo mismo.

const oido = document.getElementById("oido");

let escuchando = null;
let ocupado = false;

function mostrarOido(texto, seguro) {
  if (!texto) {
    oido.classList.remove("se-ve");

    return;
  }

  oido.innerHTML = seguro ? texto : "<i>" + texto + "</i>";
  oido.classList.add("se-ve");
}

function conversar() {
  const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Reconocedor) {
    rotulo.textContent = "sin oido en este navegador";
    mostrarOido("Este navegador no reconoce voz. Prueba con Chrome.", true);

    return;
  }

  escuchando = new Reconocedor();

  escuchando.lang = "es-CO";
  escuchando.continuous = true;
  escuchando.interimResults = true;

  escuchando.onstart = function () {
    if (!ocupado) arquitecto.escuchar();
  };

  escuchando.onresult = function (e) {
    let firme = "", suelto = "";

    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) firme += e.results[i][0].transcript;
      else suelto += e.results[i][0].transcript;
    }

    if (suelto) mostrarOido(suelto, false);

    const orden = firme.trim();

    if (!orden || ocupado) return;

    // Dos palabras minimo: un carraspeo o un "ya" suelto no es una orden.
    if (orden.split(/\s+/).length < 2) return;

    mostrarOido(orden, true);
    enviarOrden(orden);
  };

  escuchando.onerror = function (e) {
    if (e.error === "not-allowed") {
      rotulo.textContent = "sin permiso de microfono";
      mostrarOido("Dale permiso al microfono y recarga.", true);
    }
  };

  // Chrome corta la escucha sola cada cierto tiempo. Sin volver a
  // arrancarla, deja de oir a los pocos minutos y parece averiada.
  escuchando.onend = function () {
    if (ocupado) return;

    try { escuchando.start(); } catch (e) { /* ya estaba */ }
  };

  try { escuchando.start(); } catch (e) { /* ya estaba */ }
}

async function enviarOrden(texto) {
  ocupado = true;

  try { escuchando.stop(); } catch (e) { /* ya parada */ }

  arquitecto.pensar();

  let datos;

  try {
    const respuesta = await fetch("/orden", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: texto }),
    });

    datos = await respuesta.json();

  } catch (e) {
    mostrarOido("No pude hablar con el arquitecto: " + e.message, true);
    arquitecto.reposo();
    ocupado = false;

    try { escuchando.start(); } catch (e2) { /* ya estaba */ }

    return;
  }

  mostrarOido(datos.respuesta || texto, true);

  arquitecto.hablar(datos.ms || 1200, datos.dicho || datos.respuesta || "");

  // No se vuelve a escuchar hasta que termina de hablar: si no, se oye a
  // si mismo por los altavoces y se contesta solo.
  setTimeout(function () {
    ocupado = false;

    try { escuchando.start(); } catch (e) { /* ya estaba */ }
  }, (datos.ms || 1200) + 700);
}

// --- La ventana flotante -----------------------------------------------------
//
// Oir "puntuacion 99.26, cuarenta y una incidencias" y que se quede en el
// aire no es lo mismo que verlo. Esto lo deja en pantalla, en miniatura,
// para poder volver a mirarlo.
//
// Se agranda con doble clic o diciendoselo. Lo segundo no pasa por el
// modelo: "ampliala" se resuelve en el sitio, porque mandar a un modelo la
// orden de mover una caja que ya esta en pantalla son dos segundos de
// espera para nada.

const panel = document.getElementById("panel");

let panelActual = null;
let relojVivo = null;

function mostrarPanel(datos) {
  panelActual = datos;

  panel.innerHTML = pintarPanel(datos);
  panel.classList.add("se-ve");

  clearInterval(relojVivo);

  // El reloj sigue corriendo: una hora congelada en pantalla es peor que
  // no tenerla, porque parece buena y no lo es.
  if (datos.tipo === "reloj") {
    relojVivo = setInterval(function () {
      const ahora = new Date();
      const hh = String(ahora.getHours()).padStart(2, "0");
      const mm = String(ahora.getMinutes()).padStart(2, "0");
      const ss = String(ahora.getSeconds()).padStart(2, "0");

      const donde = panel.querySelector(".cifra");

      if (donde) donde.innerHTML = hh + ":" + mm + "<small>" + ss + "</small>";
    }, 1000);
  }
}

function escapar(texto) {
  return String(texto === null || texto === undefined ? "" : texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function pintarPanel(d) {
  const titulo = "<h4>" + escapar(d.titulo || "") + "</h4>";
  const ojo = '<div class="ojo">doble clic para ampliar</div>';

  let cuerpo = "";

  if (d.tipo === "reloj") {
    cuerpo =
      '<div class="cifra">' + escapar(d.hora) +
      "<small>" + escapar(d.segundos) + "</small></div>" +
      '<div class="pie-panel">' + escapar(d.fecha) + "</div>";

  } else if (d.tipo === "puntuacion") {
    cuerpo =
      '<div class="cifra">' + escapar(d.valor) + "<small>/100</small></div>" +
      '<div class="pie-panel">' + escapar(d.incidencias) + " incidencias" +
      (d.veredicto ? " · " + escapar(d.veredicto) : "") + "</div>";

  } else if (d.tipo === "hallazgos") {
    const lista = (d.con_hallazgos || [])
      .map(function (a) { return "<li><b>" + escapar(a) + "</b></li>"; })
      .join("");

    cuerpo =
      '<div class="cifra">' + escapar(d.total) + "</div>" +
      '<div class="pie-panel">hallazgos de ' + escapar(d.agentes) +
      " agentes</div><ul>" + lista + "</ul>";

  } else if (d.tipo === "estado") {
    const filas = Object.entries(d.componentes || {})
      .map(function (par) {
        return "<li>" + escapar(par[0]) + "<b>" + escapar(par[1]) + "</b></li>";
      })
      .join("");

    cuerpo =
      '<div class="cifra" style="font-size:26px">' + escapar(d.estado) +
      "</div><ul>" + filas + "</ul>";

  } else if (d.tipo === "estructura") {
    cuerpo =
      '<div class="cifra">' + escapar(d.archivos) + "<small>archivos</small></div>" +
      "<ul><li>líneas<b>" + escapar(d.lineas) + "</b></li>" +
      "<li>funciones<b>" + escapar(d.funciones) + "</b></li></ul>";

  } else {
    cuerpo = "<pre>" + escapar(d.cuerpo) + "</pre>";
  }

  return titulo + cuerpo + ojo;
}

function ordenarVentana(orden) {
  if (orden === "cerrar") {
    panel.classList.remove("se-ve", "grande");
    clearInterval(relojVivo);

    return;
  }

  if (!panelActual) return;                 // no hay nada que agrandar

  panel.classList.add("se-ve");
  panel.classList.toggle("grande", orden === "ampliar");
}

panel.addEventListener("dblclick", function () {
  panel.classList.toggle("grande");
});

// Arrastrable: si tapa la cara, se aparta.
(function () {
  let cogido = false, dx = 0, dy = 0;

  panel.addEventListener("pointerdown", function (e) {
    cogido = true;
    dx = e.clientX - panel.offsetLeft;
    dy = e.clientY - panel.offsetTop;
    panel.setPointerCapture(e.pointerId);
  });

  panel.addEventListener("pointermove", function (e) {
    if (!cogido) return;

    panel.style.left = (e.clientX - dx) + "px";
    panel.style.top = (e.clientY - dy) + "px";
    panel.style.right = "auto";
  });

  panel.addEventListener("pointerup", function () { cogido = false; });
})();

// --- Oir con Whisper ---------------------------------------------------------
//
// El reconocedor de Chrome es gratis pero entiende el espanol regular y
// manda el audio a Google. Esto graba aqui y lo transcribe OpenAI, que
// ademas acepta contexto: pasandole los nombres de los comandos deja de
// oir "revista" donde dices "revisa".
//
// Lo que se paga es por minuto de audio, asi que **no se manda el
// silencio**. Un medidor de volumen decide cuando empiezas y cuando
// paras, y solo ese trozo sale de aqui. Una conversacion de una hora con
// diez ordenes son diez segundos de audio, no una hora.

// Por encima de esto se considera que hay voz. Subido a proposito: quien
// habla es el que esta delante del microfono, y con el umbral bajo entraba
// la television, la conversacion de al lado y el pasillo. Lo lejano queda
// por debajo; lo tuyo, no.
const UMBRAL_VOZ = 0.045;

// Cuanto silencio cierra la frase. Menos corta las pausas al pensar;
// mas y hay que esperar mirando la pantalla.
const SILENCIO_FINAL = 900;

// Voz sostenida minima para que cuente como orden, y no una tos.
const VOZ_MINIMA = 280;

async function escucharConWhisper() {
  let flujo;

  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });

  } catch (e) {
    rotulo.textContent = "sin permiso de microfono";
    mostrarOido("Dale permiso al microfono y recarga la pagina.", true);

    return;
  }

  const sonido = new (window.AudioContext || window.webkitAudioContext)();
  const fuente = sonido.createMediaStreamSource(flujo);
  const medidor = sonido.createAnalyser();

  medidor.fftSize = 1024;
  fuente.connect(medidor);

  const muestras = new Float32Array(medidor.fftSize);

  let grabadora = null;
  let trozos = [];
  let vozAcumulada = 0;
  let calladoDesde = 0;

  arquitecto.escuchar();

  setInterval(function () {
    if (ocupado) return;

    medidor.getFloatTimeDomainData(muestras);

    let suma = 0;

    for (let i = 0; i < muestras.length; i++) suma += muestras[i] * muestras[i];

    const volumen = Math.sqrt(suma / muestras.length);
    const ahora = performance.now();

    if (volumen > UMBRAL_VOZ) {
      calladoDesde = 0;
      vozAcumulada += 60;

      if (!grabadora) {
        trozos = [];
        vozAcumulada = 60;

        grabadora = new MediaRecorder(flujo);
        grabadora.ondataavailable = function (e) {
          if (e.data.size) trozos.push(e.data);
        };
        grabadora.start(200);
      }

      return;
    }

    if (!grabadora) return;

    if (!calladoDesde) calladoDesde = ahora;

    if (ahora - calladoDesde < SILENCIO_FINAL) return;

    // Se acabo la frase.
    const suficiente = vozAcumulada >= VOZ_MINIMA;
    const cerrando = grabadora;

    grabadora = null;
    calladoDesde = 0;
    vozAcumulada = 0;

    cerrando.onstop = function () {
      if (!suficiente || !trozos.length) return;      // una tos, un golpe

      enviarAudio(new Blob(trozos, { type: "audio/webm" }));
    };

    cerrando.stop();
  }, 60);
}

async function enviarAudio(audio) {
  ocupado = true;

  arquitecto.pensar();
  mostrarOido("...", false);

  let datos;

  try {
    const respuesta = await fetch("/oir", {
      method: "POST",
      headers: {
        "Content-Type": "audio/webm",
        // Quien manda es la ultima pestana que se abrio. Con dos abiertas
        // habia dos micros encendidos: mientras una hablaba, la otra la
        // oia por los altavoces y la devolvia como si fuera una orden.
        "X-Turno": AJUSTES.turno || "",
      },
      body: audio,
    });

    datos = await respuesta.json();

  } catch (e) {
    mostrarOido("No pude hablar con el arquitecto: " + e.message, true);
    arquitecto.escuchar();
    ocupado = false;

    return;
  }

  if (datos.detener) {
    // Se abrio la cara en otra pestana. Esta se calla en vez de pelearse
    // por el microfono, y lo dice para que no parezca averiada.
    rotulo.textContent = "en pausa";
    mostrarOido("Hay otra ventana escuchando. Cierra esta.", true);

    return;                                   // ocupado se queda en true
  }

  if (datos.oido) mostrarOido(datos.oido, true);

  // El servidor contesta al momento con un resguardo y hace la faena
  // aparte. Antes esta peticion tardaba lo que tardara el comando —hasta
  // medio minuto con los agentes— y en todo ese rato la cara no decia ni
  // hacia nada. Ahora se sabe enseguida que se te oyo, y la respuesta se
  // recoge cuando esta.
  // No era para el: alguien hablando cerca, la tele, el telefono. Ni se
  // ejecuta ni se contesta, y se vuelve a escuchar sin decir nada.
  if (datos.ajeno) {
    mostrarOido("<i>" + escapar(datos.oido) + "</i> — no era para mi", true);
    arquitecto.escuchar();
    ocupado = false;

    return;
  }

  if (datos.resguardo) {
    // Con tope. Una espera sin limite es como se quedo colgado: la pagina
    // pidiendo una respuesta que ya no iba a llegar, y sin forma de salir
    // mas que cerrandola.
    const corte = new AbortController();
    const reloj = setTimeout(function () { corte.abort(); }, 200000);

    try {
      const recogida = await fetch("/respuesta?r=" + datos.resguardo, {
        signal: corte.signal,
      });

      datos = Object.assign({ oido: datos.oido }, await recogida.json());

    } catch (e) {
      mostrarOido(
        e.name === "AbortError"
          ? "Se me fue el santo al cielo. Dimelo otra vez."
          : "Se corto mientras lo hacia: " + e.message,
        true
      );

      arquitecto.escuchar();
      ocupado = false;

      return;

    } finally {
      clearTimeout(reloj);
    }
  }

  if (datos.ventana) ordenarVentana(datos.ventana);

  if (datos.panel) mostrarPanel(datos.panel);

  if (!datos.respuesta) {
    // No entendio nada: se vuelve a escuchar sin decir una palabra, que
    // es lo que haria alguien que no oyo bien y no quiere interrumpir.
    arquitecto.escuchar();
    ocupado = false;

    return;
  }

  arquitecto.hablar(datos.ms || 1200, datos.dicho || datos.respuesta);

  // Margen generoso al volver a escuchar. El reloj de aqui y el del audio
  // —que lo pone Python— no van a la par, y quedarse corto significa oir
  // el final de la propia frase y contestarse solo. El servidor tiene su
  // propio guardia contra el eco, pero mas vale no darle trabajo.
  setTimeout(function () {
    ocupado = false;
    arquitecto.escuchar();
  }, (datos.ms || 1200) + 1400);
}

const AJUSTES = window.DATOS_ARQUITECTO || {};

if (AJUSTES.modo === "conversacion") {
  if (AJUSTES.oido === "whisper") escucharConWhisper();
  else conversar();
}

// --- El bucle ----------------------------------------------------------------

let anterior = 0;

function fotograma(ahora) {
  const reloj = ahora / 1000;
  const paso = Math.min(0.05, (ahora - anterior) / 1000) || 0.016;

  anterior = ahora;

  gesticular(ahora);
  parpadear(ahora, paso);

  // Suavizado: los musculos no saltan, llegan.
  estado.apertura += (estado.objetivoApertura - estado.apertura) * 0.28;
  estado.redondeo += (estado.objetivoRedondeo - estado.redondeo) * 0.18;
  estado.cejas += (estado.objetivoCejas - estado.cejas) * 0.10;

  // La camara manda sobre el raton cuando hay algo que seguir.
  const sigueCamara = camara.activa && camara.que !== "buscandote";

  const miraX = sigueCamara ? camara.x : estado.ratonX;
  const miraY = sigueCamara ? camara.y : estado.ratonY;

  estado.giro += (miraX * 0.50 - estado.giro) * 0.045;
  estado.giro += sigueCamara ? 0 : 0.0011;      // sin nadie delante, deriva sola
  estado.inclina += (miraY * 0.26 - estado.inclina) * 0.045;

  const fuente = camara.activa ? "siguiendo " + camara.que : "raton";

  if (fuente !== ultimaFuente) {
    ultimaFuente = fuente;
    pie.textContent = "espacio · hablar     " + fuente;
  }

  dibujar(reloj);

  requestAnimationFrame(fotograma);
}

function gesticular(ahora) {
  if (estado.modo !== "hablando") {
    estado.objetivoApertura = estado.modo === "escuchando" ? 0.05 : 0;
    estado.objetivoRedondeo = 0;

    // Escuchando levanta las cejas —atencion—; pensando las baja y las
    // junta. Son dos gestos distintos y se leen sin explicarlos.
    estado.objetivoCejas = estado.modo === "escuchando" ? 0.35
                         : estado.modo === "pensando" ? -0.30 : 0;
    estado.cabeceo *= 0.94;

    return;
  }

  if (ahora > estado.hasta) {
    arquitecto.reposo();

    return;
  }

  const t = ahora - estado.empezo;

  const silaba = estado.guion.find(s => t >= s.desde && t < s.desde + s.dura);

  if (!silaba) {
    // Sin texto solo se sabe cuanto dura, asi que se finge un ritmo. Se
    // nota menos que dejar la boca quieta, y se dice que es asi.
    const r = ahora / 1000;

    estado.objetivoApertura = 0.30 + 0.30 * Math.abs(
      Math.sin(r * 10.7) * 0.6 + Math.sin(r * 6.3) * 0.4
    );
    estado.objetivoRedondeo = 0.2;

    return;
  }

  const avance = (t - silaba.desde) / silaba.dura;

  // Dentro de cada silaba: cierre, ataque, sostenimiento y caida. Sin la
  // fase de cierre las palabras se funden y parece que masca.
  let sobre;

  if (avance < 0.14) sobre = (1 - silaba.cierra) * (avance / 0.14);
  else if (avance < 0.42) sobre = (avance - 0.14) / 0.28;
  else if (avance < 0.72) sobre = 1;
  else sobre = 1 - (avance - 0.72) / 0.28;

  estado.objetivoApertura = silaba.abre * Math.max(0, Math.min(1, sobre)) * 0.92;
  estado.objetivoRedondeo = silaba.redondo;

  // Las cejas acompanan lo abierto de la vocal: no es adorno, es lo que
  // separa hablar de mover la mandibula.
  estado.objetivoCejas = silaba.abre * 0.55;

  // Y la cabeza asiente con el ritmo.
  estado.cabeceo = estado.cabeceo * 0.86 + silaba.abre * 0.020 * Math.sin(avance * Math.PI);
}

function parpadear(ahora, paso) {
  estado.proximoParpadeo -= paso * 1000;

  if (estado.proximoParpadeo <= 0) {
    estado.parpadeo = 1;
    estado.proximoParpadeo = 2200 + Math.random() * 4200;
  }

  estado.parpadeo = Math.max(0, estado.parpadeo - paso * 7.5);
}

// --- Dibujar -----------------------------------------------------------------

const visibles = [];

function dibujar(reloj) {
  ctx.fillStyle = "#04030c";
  ctx.fillRect(0, 0, ancho, alto);
  ctx.globalCompositeOperation = "lighter";

  const inclina = estado.inclina + estado.cabeceo;

  const cosY = Math.cos(estado.giro), senY = Math.sin(estado.giro);
  const cosX = Math.cos(inclina), senX = Math.sin(inclina);

  const cx = ancho / 2;
  const cy = alto / 2 + alto * 0.02;

  const respira = Math.sin(reloj * 0.75) * 0.010;

  visibles.length = 0;

  for (const p of particulas) {
    // La deriva: cada particula flota a su ritmo alrededor de su sitio.
    // Es lo unico que separa una nebulosa de una constelacion.
    const d = reloj * p.vel + p.fase;

    let x = p.bx + Math.sin(d) * p.vaiven;
    let y = p.by + Math.cos(d * 0.83) * p.vaiven + respira;
    let z = p.bz + Math.sin(d * 0.61) * p.vaiven * 0.7;

    let alfa = p.brillo;

    if (p.clase === "cara") {
      // La mandibula baja, y con ella todo lo que cuelga de ella.
      y -= estado.apertura * 0.175 * p.mandibula;
      z += estado.apertura * 0.030 * p.mandibula;

      // Los labios: el de arriba apenas se mueve, el de abajo va con la
      // mandibula y ademas se separa.
      y += estado.apertura * 0.022 * p.labioAlto;
      y -= estado.apertura * 0.055 * p.labioBajo;

      // Redondear acerca las comisuras y adelanta los labios.
      const labio = p.labioAlto + p.labioBajo;

      x -= x * estado.redondeo * 0.22 * labio;
      z += estado.redondeo * 0.075 * labio;

      // El hueco de la boca. Apagar estas particulas es lo que se ve como
      // boca abierta: sobre negro, la ausencia de luz *es* la sombra.
      alfa *= 1 - p.interior * Math.min(1, estado.apertura * 2.3);

      // Cejas.
      y += estado.cejas * 0.030 * p.ceja;

      // Parpado: los ojos se cierran hacia su propia linea.
      if (p.ojo > 0.02 && estado.parpadeo > 0) {
        y += (-0.148 - p.by) * estado.parpadeo * p.ojo * 0.9;
        alfa *= 1 - estado.parpadeo * p.ojo * 0.55;
      }
    }

    const rx = x * cosY + z * senY;
    const rz = z * cosY - x * senY;
    const ry = y * cosX - rz * senX;
    const rz2 = rz * cosX + y * senX;

    const hondo = rz2 + CAMARA;

    if (hondo < 0.30 || alfa < 0.012) continue;

    const k = LENTE / hondo;

    visibles.push({
      px: cx + rx * k * escala,
      py: cy - ry * k * escala,
      r: k * p.tam * 1.5,
      z: rz2,
      alfa: alfa,
      indice: p.indice,
      clase: p.clase,
      gas: p.gas,
    });
  }

  visibles.sort(function (a, b) { return a.z - b.z; });

  for (const v of visibles) {
    const frente = Math.min(1, Math.max(0, (v.z + 0.9) / 1.9));

    // Niebla de profundidad: lo de atras se apaga deprisa y la cara se
    // despega del fondo en vez de fundirse con el.
    let alfa = v.alfa * (0.14 + Math.pow(frente, 1.7) * 0.95);

    if (v.gas) alfa *= 0.30;                     // el gas suma poco, muchas veces

    if (alfa < 0.008) continue;

    const radio = v.r * (0.55 + frente * 1.25);

    if (radio < 0.12) continue;

    ctx.globalAlpha = Math.min(1, alfa);

    const luz = v.clase === "estrella" ? ESTRELLA
              : v.clase === "bruma" ? POLVO
              : PALETA[v.indice];

    ctx.drawImage(luz, v.px - radio * 2.2, v.py - radio * 2.2, radio * 4.4, radio * 4.4);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

requestAnimationFrame(fotograma);
</script>
