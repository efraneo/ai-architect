<!doctype html>
<meta charset="utf-8">
<title>Arquitecto</title>
<style>
  :root { color-scheme: dark; }

  html, body {
    margin: 0;
    height: 100%;
    background: #04030c;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 44%, rgba(90, 60, 190, .22), transparent 70%),
      radial-gradient(ellipse 40% 30% at 32% 30%, rgba(40, 130, 220, .16), transparent 70%);
    pointer-events: none;
  }

  canvas { display: block; }

  .hud {
    position: fixed;
    left: 26px;
    bottom: 22px;
    color: #9fb8ff;
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-shadow: 0 0 14px rgba(110, 90, 255, .8);
    pointer-events: none;
  }

  .hud b { color: #f2eaff; font-weight: 600; }

  .hud .estado { color: #f0a8d8; }

  .pie {
    position: fixed;
    right: 26px;
    bottom: 22px;
    color: rgba(150, 150, 210, .45);
    font-size: 11px;
    letter-spacing: .12em;
    pointer-events: none;
  }

  /* Lo que cree haber oido. Verlo en pantalla es la diferencia entre
     "no me escucha" y "me escucha pero entendio otra cosa". */
  .oido {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 66px;
    max-width: 74vw;
    text-align: center;
    color: #cfe4ff;
    font-size: 15px;
    line-height: 1.5;
    text-shadow: 0 0 18px rgba(60, 120, 255, .9);
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }

  .oido.se-ve { opacity: 1; }

  .oido i { color: rgba(200, 220, 255, .5); font-style: normal; }

  /* --- La ventana flotante -------------------------------------------
     Miniatura por defecto: lo que se pregunta de viva voz casi siempre
     cabe en un vistazo. Doble clic —o decirselo— la agranda. */
  .panel {
    position: fixed;
    right: 30px;
    top: 30px;
    width: 244px;
    padding: 15px 17px 17px;
    border-radius: 15px;
    background: rgba(12, 10, 30, .82);
    border: 1px solid rgba(130, 150, 255, .28);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .6),
                0 0 42px rgba(80, 90, 220, .22) inset;
    backdrop-filter: blur(13px);
    color: #dbe6ff;
    opacity: 0;
    transform: scale(.94) translateY(-8px);
    transition: opacity .28s, transform .28s, width .28s, padding .28s;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }

  .panel.se-ve { opacity: 1; transform: none; pointer-events: auto; cursor: grab; }

  .panel.grande { width: min(560px, 76vw); padding: 25px 28px 28px; }

  .panel h4 {
    margin: 0 0 11px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: #8fa6ff;
  }

  .panel .cifra {
    font-size: 40px;
    font-weight: 200;
    line-height: 1;
    color: #f0f5ff;
    font-variant-numeric: tabular-nums;
  }

  .panel.grande .cifra { font-size: 72px; }

  .panel .cifra small { font-size: .42em; color: #8fa6ff; margin-left: 4px; }

  .panel .pie-panel { margin-top: 9px; font-size: 12px; color: #9fb0dd; }

  .panel ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; }

  .panel li {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 4px 0;
    border-top: 1px solid rgba(130, 150, 255, .12);
  }

  .panel li b { color: #eaf0ff; font-weight: 500; }

  .panel pre {
    margin: 10px 0 0;
    max-height: 120px;
    overflow: auto;
    font-size: 11px;
    line-height: 1.5;
    color: #b9c8ee;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .panel.grande pre { max-height: 52vh; }

  .panel .ojo {
    margin-top: 11px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(150, 165, 220, .5);
  }

  /* --- Las fases del rostro (fase 4) ----------------------------------
     Reposo, escucha, pensando y hablando ya estaban. Se suman
     **trabajando** (una reticula gira alrededor y cada herramienta deja
     una tarjeta), **pidiendo permiso** (ambar, con dos botones) y el
     destello de **exito/error**. Las animaciones van en CSS —se inspiran
     en el HUD de OpenJarvis, Apache-2.0— para que no cuesten un solo
     fotograma al canvas. */
  @keyframes respirar {
    0%, 100% { box-shadow: 0 0 0 1px rgba(130, 150, 255, .28), 0 0 0 0 rgba(90, 120, 255, 0); }
    50%      { box-shadow: 0 0 0 1px rgba(150, 170, 255, .5), 0 0 24px -4px rgba(90, 120, 255, .55); }
  }

  @keyframes barrido {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  @keyframes reticula {
    0%   { transform: translate(-50%, -50%) rotate(0deg); opacity: .22; }
    50%  { opacity: .55; }
    100% { transform: translate(-50%, -50%) rotate(360deg); opacity: .22; }
  }

  @keyframes latido {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    40%      { transform: translate(-50%, -50%) scale(1.05); }
  }

  @keyframes latido-caja {
    0%, 100% { box-shadow: 0 0 40px rgba(255, 170, 40, .22); }
    40%      { box-shadow: 0 0 60px rgba(255, 170, 40, .45); }
  }

  @keyframes entrar {
    to { opacity: 1; transform: none; }
  }

  @keyframes destello {
    0%   { opacity: .6; }
    100% { opacity: 0; }
  }

  .reticula {
    position: fixed;
    left: 50%;
    top: 51%;
    width: min(64vh, 64vw);
    height: min(64vh, 64vw);
    border-radius: 50%;
    border: 1px dashed rgba(120, 200, 255, .38);
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity .45s, border-color .45s;
    pointer-events: none;
  }

  .reticula::before {
    content: "";
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 1px solid rgba(120, 200, 255, .12);
  }

  body.trabajando .reticula { opacity: 1; animation: reticula 14s linear infinite; }

  body.pidiendo .reticula {
    opacity: 1;
    border-color: rgba(255, 190, 70, .6);
    animation: latido 1.8s ease-in-out infinite;
  }

  .tarjetas {
    position: fixed;
    left: 26px;
    top: 26px;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    z-index: 9;
  }

  .tarjeta {
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(12, 10, 30, .78);
    border: 1px solid rgba(130, 150, 255, .22);
    color: #dbe6ff;
    font-size: 12px;
    line-height: 1.4;
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateX(-10px);
    animation: entrar .25s forwards;
    word-break: break-word;
  }

  .tarjeta b {
    display: block;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #8fa6ff;
    margin-bottom: 3px;
  }

  .tarjeta small { color: #9fb0dd; display: block; }

  .tarjeta.va {
    background-image: linear-gradient(90deg, transparent 0%, rgba(120, 160, 255, .16) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: entrar .25s forwards, barrido 1.4s linear infinite, respirar 1.6s ease-in-out infinite;
  }

  .tarjeta.ok { border-color: rgba(90, 220, 140, .45); }
  .tarjeta.ok b { color: #7de2a3; }
  .tarjeta.mal { border-color: rgba(255, 110, 110, .5); }
  .tarjeta.mal b { color: #ff8a8a; }
  .tarjeta.ambar { border-color: rgba(255, 190, 70, .6); }
  .tarjeta.ambar b { color: #ffc766; }

  .permiso {
    position: fixed;
    left: 50%;
    bottom: 118px;
    transform: translateX(-50%);
    width: min(520px, 80vw);
    padding: 16px 20px;
    border-radius: 14px;
    background: rgba(40, 28, 8, .86);
    border: 1px solid rgba(255, 190, 70, .55);
    backdrop-filter: blur(12px);
    color: #ffe9c2;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 11;
  }

  .permiso.se-ve { opacity: 1; pointer-events: auto; animation: latido-caja 2.4s ease-in-out infinite; }

  .permiso h4 {
    margin: 0 0 8px;
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: #ffc766;
  }

  .permiso ul { margin: 0 0 12px; padding-left: 18px; font-size: 13px; line-height: 1.5; }

  .permiso .botones { display: flex; gap: 10px; }

  .permiso button {
    flex: 1;
    padding: 9px 0;
    border-radius: 9px;
    border: 1px solid rgba(255, 190, 70, .6);
    background: rgba(255, 190, 70, .12);
    color: #ffe9c2;
    font: inherit;
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .permiso button.si {
    background: rgba(120, 220, 150, .18);
    border-color: rgba(120, 220, 150, .6);
    color: #d9ffe6;
  }

  .permiso button:hover { filter: brightness(1.25); }

  /* En la ventana flotante (440 px) el pie derecho se montaba sobre el
     rotulo de estado: ahi sobra. */
  @media (max-width: 640px) {
    .pie { display: none; }
    .tarjetas { width: min(300px, 62vw); }
    .oido { font-size: 13px; bottom: 58px; }
  }

  /* Cuando pide un dato (un token, una clave): un campo, y nada mas. */
  .dato {
    position: fixed;
    left: 50%;
    bottom: 118px;
    transform: translateX(-50%);
    width: min(520px, 80vw);
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(10, 18, 40, .88);
    border: 1px solid rgba(120, 200, 255, .5);
    backdrop-filter: blur(12px);
    color: #dbe6ff;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 12;
  }

  .dato.se-ve { opacity: 1; pointer-events: auto; }

  .dato label { display: block; font-size: 12px; line-height: 1.4; margin-bottom: 8px; color: #9fd0ff; }

  .dato .fila { display: flex; gap: 8px; }

  .dato input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(120, 200, 255, .4);
    background: rgba(0, 0, 0, .35);
    color: #f0f5ff;
    font: inherit;
    font-size: 13px;
  }

  .dato button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(120, 220, 150, .6);
    background: rgba(120, 220, 150, .18);
    color: #d9ffe6;
    font: inherit;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .destello { position: fixed; inset: 0; pointer-events: none; opacity: 0; }

  .destello.exito {
    background: radial-gradient(ellipse at 50% 50%, rgba(90, 230, 150, .55), transparent 65%);
    animation: destello 1.1s ease-out forwards;
  }

  .destello.error {
    background: radial-gradient(ellipse at 50% 50%, rgba(255, 90, 90, .55), transparent 65%);
    animation: destello 1.1s ease-out forwards;
  }
</style>

<script>
// =========================================================
// Una nebulosa que forma un rostro
//
// El intento anterior eran puntos sobre una esfera: se leia
// como una malla, no como una cara. Un rostro humano no se
// reconoce por el contorno sino por **como le da la luz** —
// el pomulo encendido, la cuenca en sombra, el lado oscuro
// de la nariz—. Asi que cada particula calcula su propia
// normal sobre la superficie de la cara y se ilumina; el
// volumen sale de ahi, no del dibujo.
//
// Y para que sea nebulosa y no puntitos: mucha particula
// grande, blanda y casi transparente por detras, poca y
// brillante delante, todo sumandose. La niebla la hacen las
// blandas; la cara, las brillantes.
//
// Nada de esto se anima al azar. Cuando habla, la mandibula
// y los labios siguen las **silabas reales** del texto, que
// Python le pasa junto con la duracion exacta del audio.
// =========================================================

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d", { alpha: false });
const rotulo = document.getElementById("estado");
const pie = document.getElementById("pie");

let ultimaFuente = "";

const CAMARA = 1.62;
const LENTE = 2.3;

let ancho = 0, alto = 0, escala = 0, pixeles = 1;

function medir() {
  pixeles = Math.min(window.devicePixelRatio || 1, 2);
  ancho = window.innerWidth;
  alto = window.innerHeight;

  lienzo.width = ancho * pixeles;
  lienzo.height = alto * pixeles;
  lienzo.style.width = ancho + "px";
  lienzo.style.height = alto + "px";

  ctx.setTransform(pixeles, 0, 0, pixeles, 0, 0);
  escala = Math.min(ancho, alto * 0.82) * 0.46;
}

window.addEventListener("resize", medir);
medir();

// --- Paleta -----------------------------------------------------------------
//
// Los halos se pintan una vez y luego se estampan escalados. `shadowBlur`
// por particula, a seis mil particulas y sesenta fotogramas, no llega.

function halo(r, g, b, dureza) {
  const hoja = document.createElement("canvas");
  hoja.width = hoja.height = 96;

  const pincel = hoja.getContext("2d");
  const grad = pincel.createRadialGradient(48, 48, 0, 48, 48, 48);

  // `dureza` alta => nucleo apretado y brillante (una chispa).
  // `dureza` baja => se desvanece despacio (gas).
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const a = Math.pow(1 - t, dureza);

    grad.addColorStop(t, "rgba(" + r + "," + g + "," + b + "," + a.toFixed(3) + ")");
  }

  pincel.fillStyle = grad;
  pincel.fillRect(0, 0, 96, 96);

  return hoja;
}

// De lo mas hondo y frio a lo mas encendido. El indice lo decide la luz
// que recibe cada particula, asi que la paleta *es* el sombreado.
const PALETA = [
  halo(58, 34, 116, 1.5),     // 0  polvo violeta del fondo
  halo(78, 52, 168, 1.8),     // 1  penumbra
  halo(70, 96, 214, 2.1),     // 2  azul medio
  halo(86, 168, 236, 2.5),    // 3  azul claro
  halo(156, 214, 252, 3.0),   // 4  luz
  halo(236, 246, 255, 4.0),   // 5  alta luz
  halo(255, 168, 214, 3.2),   // 6  rosa de nebulosa (rebote calido)
];

const POLVO = halo(96, 62, 190, 1.2);
const ESTRELLA = halo(255, 255, 255, 5.0);

// --- La forma de una cara ---------------------------------------------------
//
// `perfil(x, y)` devuelve cuanto sobresale la cara en ese punto. Es la
// pieza central: de aqui salen la silueta, el relieve y la iluminacion.

function campana(d, s) {
  return Math.exp(-(d * d) / (2 * s * s));
}

function campana2(dx, dy, sx, sy) {
  return campana(dx, sx) * campana(dy, sy);
}

const ANCHO_CARA = 0.70;
const ALTO_CARA = 1.02;

function perfil(x, y) {
  const t = 1 - (x / ANCHO_CARA) ** 2 - (y / ALTO_CARA) ** 2;

  if (t <= 0) return null;                      // fuera del ovalo

  let z = Math.sqrt(t) * 0.60;

  // La frente es mas plana que una esfera; sin esto parece un globo.
  z -= campana(y - 0.66, 0.32) * 0.055;

  // Arco de las cejas.
  z += campana(y - 0.31, 0.095) * campana(x, 0.40) * 0.050;

  // Cuencas. Hundidas, que es lo que crea la sombra que lee el ojo.
  z -= (campana2(x - 0.295, y - 0.145, 0.185, 0.125) +
        campana2(x + 0.295, y - 0.145, 0.185, 0.125)) * 0.115;

  // Caballete de la nariz, de la ceja a la punta.
  z += campana(x, 0.070) * campana(y + 0.055, 0.30) * 0.185;

  // Punta y aletas.
  z += campana2(x, y + 0.285, 0.090, 0.070) * 0.115;
  z += (campana2(x - 0.105, y + 0.295, 0.050, 0.055) +
        campana2(x + 0.105, y + 0.295, 0.050, 0.055)) * 0.050;

  // Pomulos: lo que mas define una cara despues de la nariz.
  z += (campana2(x - 0.415, y + 0.015, 0.185, 0.215) +
        campana2(x + 0.415, y + 0.015, 0.185, 0.215)) * 0.048;

  // Surco entre nariz y labio.
  z -= campana2(x, y + 0.415, 0.075, 0.045) * 0.022;

  // Labios.
  z += campana2(x, y + 0.520, 0.225, 0.070) * 0.072;

  // Hueco bajo el labio inferior, y barbilla.
  z -= campana2(x, y + 0.665, 0.150, 0.048) * 0.032;
  z += campana2(x, y + 0.800, 0.180, 0.120) * 0.052;

  return z;
}

// La normal, por diferencias finitas. Es aproximada y da igual: lo unico
// que tiene que hacer es decidir si un punto mira hacia la luz o no.
const PASO = 0.02;

const LUZ = (function () {
  const v = [-0.42, 0.52, 0.78];
  const n = Math.hypot(v[0], v[1], v[2]);

  return [v[0] / n, v[1] / n, v[2] / n];
})();

function iluminacion(x, y, z) {
  const zx = perfil(x + PASO, y);
  const zy = perfil(x, y + PASO);

  if (zx === null || zy === null) return 0.30;

  const nx = -(zx - z) / PASO;
  const ny = -(zy - z) / PASO;
  const largo = Math.hypot(nx, ny, 1);

  const lum = (nx * LUZ[0] + ny * LUZ[1] + LUZ[2]) / largo;

  return Math.max(0, lum);
}

// --- Sembrar la nebulosa ----------------------------------------------------

const particulas = [];

// Donde la nebulosa se condensa. Un gas uniforme no forma una cara: hace
// falta que se apelotone justo en los rasgos.
function densidad(x, y) {
  let d = 0.34;

  d += campana(x, 0.075) * campana(y + 0.06, 0.30) * 0.55;          // nariz
  d += campana2(x, y + 0.285, 0.10, 0.085) * 0.60;                  // punta
  d += campana2(x, y + 0.520, 0.235, 0.070) * 0.85;                 // labios
  d += (campana2(x - 0.295, y - 0.145, 0.175, 0.105) +
        campana2(x + 0.295, y - 0.145, 0.175, 0.105)) * 0.75;       // ojos
  d += campana(y - 0.31, 0.075) * campana(x, 0.38) * 0.55;          // cejas
  d += campana2(x, y + 0.800, 0.185, 0.115) * 0.35;                 // barbilla

  // El borde del ovalo se difumina: asi la cara se deshace en gas por los
  // lados en vez de tener un recorte limpio.
  const r = Math.hypot(x / ANCHO_CARA, y / ALTO_CARA);

  d *= 1 - Math.pow(Math.min(1, r), 5) * 0.75;

  return d;
}

function sembrarRostro(cuantas) {
  let intentos = 0;

  while (particulas.length < cuantas && intentos < cuantas * 40) {
    intentos++;

    const x = (Math.random() * 2 - 1) * ANCHO_CARA;
    const y = (Math.random() * 2 - 1) * ALTO_CARA;

    const z = perfil(x, y);

    if (z === null) continue;
    if (Math.random() > densidad(x, y)) continue;

    const lum = iluminacion(x, y, z);

    // Un poco de grosor: la cara no es una cascara de papel.
    const grosor = (Math.random() - 0.5) * 0.055;

    particulas.push(nueva(x, y, z + grosor, lum, "cara"));
  }
}

function nueva(x, y, z, lum, clase) {
  // El brillo no es lineal: se exagera el contraste para que la sombra de
  // la cuenca y la luz del pomulo se separen de verdad.
  const brillo = Math.pow(lum, 1.45);

  // La mayoria son chispas pequenas; unas pocas, gas grande y blando.
  const gas = Math.random() < 0.20;

  let indice = Math.min(5, Math.floor(brillo * 6.2));

  // Un rebote calido en lo mas iluminado. Es lo que le quita el aire de
  // holograma azul y lo acerca a piel.
  if (brillo > 0.80 && Math.random() < 0.35) indice = 6;

  // A donde se va esta particula cuando el rostro se deshace. Se calcula
  // una vez y es suya: asi cada una vuelve a su sitio y la cara se rehace
  // igual que estaba, no parecida.
  const rumbo = Math.random() * Math.PI * 2;
  const ladeo = Math.acos(2 * Math.random() - 1);
  const lejos = 1.15 + Math.pow(Math.random(), 0.55) * 1.5;

  return {
    bx: x, by: y, bz: z,
    x: x, y: y, z: z,
    // La nube no es una esfera: se estira a lo ancho y se aplana, que es
    // como se ve una nebulosa de verdad y no una pelota de puntos.
    dx: Math.sin(ladeo) * Math.cos(rumbo) * lejos * 1.45,
    dy: Math.cos(ladeo) * lejos * 0.78,
    dz: Math.sin(ladeo) * Math.sin(rumbo) * lejos * 1.15,
    // Cada una sale y vuelve a su tiempo. Todas a la vez parece un truco;
    // escalonadas parece que se deshace.
    retraso: Math.random(),
    clase: clase,
    brillo: 0.16 + brillo * 0.92,
    indice: indice,
    gas: gas,
    tam: gas ? 2.4 + Math.random() * 2.6 : 0.55 + Math.random() * 0.95,
    fase: Math.random() * Math.PI * 2,
    vel: 0.25 + Math.random() * 0.55,
    vaiven: gas ? 0.055 : 0.014,
  };
}

function sembrarCraneo(cuantas) {
  // La nuca. Apenas se ve, pero sin ella la cara flota como una mascara.
  for (let i = 0; i < cuantas; i++) {
    const u = Math.random() * 2 - 1;
    const r = Math.sqrt(Math.max(0, 1 - u * u));
    const a = Math.random() * Math.PI * 2;

    const z = -Math.abs(Math.sin(a) * r) * 0.52 - 0.05;

    const p = nueva(
      Math.cos(a) * r * 0.66,
      u * 0.98,
      z,
      0.16 + Math.random() * 0.14,
      "craneo"
    );

    p.gas = true;
    p.tam = 2.0 + Math.random() * 2.8;
    p.indice = Math.random() < 0.6 ? 0 : 1;

    particulas.push(p);
  }
}

function sembrarBruma(cuantas) {
  // El gas que envuelve. Vive fuera de la cara y se mueve mas.
  for (let i = 0; i < cuantas; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.75 + Math.pow(Math.random(), 0.6) * 1.25;

    const p = nueva(
      Math.cos(a) * r * 0.95,
      Math.sin(a) * r * 0.80 + 0.05,
      (Math.random() - 0.5) * 0.9,
      0.10 + Math.random() * 0.20,
      "bruma"
    );

    p.gas = true;
    p.tam = 3.0 + Math.random() * 4.5;
    p.vaiven = 0.10;
    p.vel = 0.10 + Math.random() * 0.25;
    p.brillo *= 0.55;

    particulas.push(p);
  }
}

function sembrarEstrellas(cuantas) {
  for (let i = 0; i < cuantas; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 1.0 + Math.random() * 1.8;

    const p = nueva(
      Math.cos(a) * r,
      Math.sin(a) * r * 0.8,
      (Math.random() - 0.5) * 1.6,
      1,
      "estrella"
    );

    p.tam = 0.35 + Math.random() * 0.45;
    p.gas = false;
    p.brillo = 0.25 + Math.random() * 0.55;

    particulas.push(p);
  }
}

sembrarRostro(4600);
sembrarCraneo(750);
sembrarBruma(820);
sembrarEstrellas(170);

// Marcas por zona, para poder moverlas al hablar. Se calculan una vez.
for (const p of particulas) {
  if (p.clase !== "cara") continue;

  // Cuanto baja con la mandibula: nada en los pomulos, todo en la barbilla.
  p.mandibula = Math.max(0, Math.min(1, (-0.34 - p.by) / 0.70));

  p.labioAlto = campana2(p.bx, p.by + 0.470, 0.230, 0.055);
  p.labioBajo = campana2(p.bx, p.by + 0.585, 0.230, 0.065);

  // Lo que hay entre los labios: se apaga al abrir la boca, y ese hueco
  // negro es lo que se lee como boca abierta.
  p.interior = campana2(p.bx, p.by + 0.528, 0.170, 0.030);

  p.ceja = campana(p.by - 0.315, 0.075) * campana(p.bx, 0.36);

  p.ojo = campana2(p.bx - 0.295, p.by - 0.150, 0.170, 0.100) +
          campana2(p.bx + 0.295, p.by - 0.150, 0.170, 0.100);
}

// --- El guion: como se mueve la boca con lo que dice -------------------------
//
// Una boca que se abre y cierra al azar se nota falsa enseguida. Esta
// sigue las silabas del texto: la "a" abre mucho, la "i" poco, la "o"
// redondea, y una "m" o una "p" cierran del todo antes de sonar.

const ABERTURA = { a: 1.00, á: 1.00, e: 0.66, é: 0.66, o: 0.74, ó: 0.74,
                   i: 0.34, í: 0.34, u: 0.36, ú: 0.36, ü: 0.36 };

const REDONDEO = { o: 0.75, ó: 0.75, u: 1.00, ú: 1.00, ü: 1.00 };

const VOCALES = "aeiouáéíóúü";

function silabar(texto) {
  const trozos = [];
  const bajo = texto.toLowerCase();

  let consonante = "";

  for (let i = 0; i < bajo.length; i++) {
    const c = bajo[i];

    if (VOCALES.includes(c)) {
      let nucleo = "";

      while (i < bajo.length && VOCALES.includes(bajo[i])) nucleo += bajo[i++];

      i--;

      // De un diptongo manda la vocal mas abierta: en "cuan" se oye la a.
      let abre = 0, redondo = 0;

      for (const v of nucleo) {
        abre = Math.max(abre, ABERTURA[v] || 0.5);
        redondo = Math.max(redondo, REDONDEO[v] || 0);
      }

      trozos.push({
        abre: abre,
        redondo: redondo,
        cierra: "mbp".includes(consonante) ? 1 : "fvw".includes(consonante) ? 0.55 : 0.15,
        peso: 1,
      });

      consonante = "";

    } else if (/[a-zñáéíóúü]/.test(c)) {
      consonante = c;

    } else if (",;:".includes(c)) {
      trozos.push({ abre: 0, redondo: 0, cierra: 0, peso: 0.85, pausa: true });
      consonante = "";

    } else if (".!?".includes(c)) {
      trozos.push({ abre: 0, redondo: 0, cierra: 0, peso: 1.7, pausa: true });
      consonante = "";
    }
  }

  return trozos;
}

function guion(texto, ms) {
  const trozos = silabar(texto || "");

  if (!trozos.length) return [];

  const total = trozos.reduce((s, t) => s + t.peso, 0);

  let reloj = 0;

  for (const t of trozos) {
    t.desde = reloj;
    t.dura = (t.peso / total) * ms;
    reloj += t.dura;
  }

  return trozos;
}

// --- Estado ------------------------------------------------------------------

const estado = {
  modo: "reposo",
  apertura: 0, objetivoApertura: 0,
  redondeo: 0, objetivoRedondeo: 0,
  cejas: 0, objetivoCejas: 0,
  // Empieza deshecho: la nebulosa. Se forma al oir la primera voz y se
  // vuelve a deshacer cuando lleva un rato en reposo.
  dispersion: 1, objetivoDispersion: 1,
  formado: false,
  ultimaInteraccion: 0,
  parpadeo: 0,
  proximoParpadeo: 2000,
  cabeceo: 0,
  giro: 0, inclina: 0,
  ratonX: 0, ratonY: 0,
  guion: [],
  empezo: 0,
  hasta: 0,
  // Fase 4: si esta esperando un permiso (ambar), y el tinte del rostro.
  pidiendo: false,
  tinte: { r: 255, g: 255, b: 255, k: 0 },
  objetivoTinte: { r: 255, g: 255, b: 255, k: 0 },
};

// Los colores de cada fase. Se aplican multiplicando sobre lo dibujado:
// trabajando tira a cian, pidiendo permiso a ambar; el resto, sin tinte.
const TINTES = {
  trabajando: { r: 110, g: 225, b: 255, k: 0.45 },
  pidiendo: { r: 255, g: 185, b: 60, k: 0.75 },
};

window.addEventListener("pointermove", function (e) {
  estado.ratonX = (e.clientX / window.innerWidth - 0.5) * 2;
  estado.ratonY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// Cuanto tiene que estar quieto para volver a ser nebulosa.
const REPOSO_MS = 25000;

const arquitecto = {
  // Fase 5: al oir una voz o recibir una orden, la nebulosa se hace rostro.
  despertar: function () {
    estado.formado = true;
    estado.ultimaInteraccion = performance.now();
  },

  hablar: function (ms, texto) {
    const duracion = ms || 2500;

    arquitecto.despertar();
    estado.modo = "hablando";
    estado.empezo = performance.now();
    estado.hasta = estado.empezo + duracion;
    estado.guion = guion(texto || "", duracion);

    document.body.classList.remove("trabajando");
    rotulo.textContent = "hablando";
  },

  escuchar: function () {
    estado.modo = "escuchando";
    document.body.classList.remove("trabajando");
    rotulo.textContent = estado.pidiendo ? "esperando tu permiso" : "escuchando";
  },

  pensar: function () {
    arquitecto.despertar();
    estado.modo = "pensando";
    estado.guion = [];
    document.body.classList.remove("trabajando");
    rotulo.textContent = "pensando";
    limpiarTarjetas();
  },

  reposo: function () {
    estado.modo = "reposo";
    estado.guion = [];
    document.body.classList.remove("trabajando");
    rotulo.textContent = estado.pidiendo ? "esperando tu permiso" : "en reposo";
  },

  // Fase 4: con las manos en el repositorio. La cara se concentra —se
  // deshace a medias, cejas bajas— y la reticula gira alrededor.
  trabajar: function () {
    arquitecto.despertar();
    estado.modo = "trabajando";
    estado.guion = [];
    document.body.classList.add("trabajando");
    rotulo.textContent = "trabajando";
  },

  // Fase 4: quiso escribir y no tenia permiso. Ambar, y dos botones. Se
  // contesta con la voz («si», «no») o pulsando.
  permiso: function (lista) {
    arquitecto.despertar();
    estado.pidiendo = true;
    document.body.classList.add("pidiendo");

    const ul = document.getElementById("permiso-lista");

    ul.innerHTML = (lista || [])
      .map(function (l) { return "<li>" + escapar(l) + "</li>"; })
      .join("");

    document.getElementById("permiso").classList.add("se-ve");
  },

  permisoResuelto: function (aprobado) {
    estado.pidiendo = false;
    document.body.classList.remove("pidiendo");
    document.getElementById("permiso").classList.remove("se-ve");

    if (aprobado) arquitecto.exito(); else arquitecto.reposo();
  },

  // Fase 4: un destello verde o rojo, y a lo que toque.
  exito: function () { destellar("exito"); },

  error: function () { destellar("error"); },
};

function destellar(clase) {
  const capa = document.getElementById("destello");

  capa.className = "destello";
  void capa.offsetWidth;                       // reinicia la animacion
  capa.classList.add(clase);

  rotulo.textContent = clase === "exito" ? "hecho" : "fallo";
}

// --- Las tarjetas de lo que va haciendo ------------------------------------

const MAXIMO_TARJETAS = 6;

function limpiarTarjetas() {
  document.getElementById("tarjetas").innerHTML = "";
}

function tarjeta(clase, titulo, cuerpo, detalle) {
  const caja = document.getElementById("tarjetas");
  const div = document.createElement("div");

  div.className = "tarjeta " + clase;
  div.innerHTML = "<b>" + escapar(titulo) + "</b>" + escapar(cuerpo || "") +
                  (detalle ? "<small>" + escapar(detalle) + "</small>" : "");
  div.dataset.titulo = titulo;

  caja.appendChild(div);

  while (caja.children.length > MAXIMO_TARJETAS) caja.removeChild(caja.firstChild);

  return div;
}

function atenderAviso(a) {
  if (a.tipo === "decir") {
    if (ocupado && !hablando()) {
      porDecir.push(a);

      return;
    }

    ocupado = true;
    procesarRespuesta({ respuesta: a.respuesta, dicho: a.dicho, ms: a.ms, audio: a.audio }, 600, true);

    return;
  }

  if (a.tipo === "fase") {
    if (a.fase === "trabajando") arquitecto.trabajar();
    else if (a.fase === "error") arquitecto.error();
    else if (a.fase === "listo" && estado.modo === "trabajando") arquitecto.exito();

    return;
  }

  if (a.tipo === "herramienta_inicio") {
    tarjeta("va", a.herramienta || "herramienta", a.argumentos || "");

    return;
  }

  if (a.tipo === "herramienta_fin") {
    const abiertas = document.querySelectorAll(".tarjeta.va");
    let div = null;

    for (const d of abiertas) if (d.dataset.titulo === a.herramienta) div = d;

    if (!div) div = tarjeta("va", a.herramienta || "herramienta", "");

    div.classList.remove("va");
    div.classList.add(a.ok ? "ok" : "mal");

    if (a.detalle) {
      const s = document.createElement("small");

      s.textContent = a.detalle;
      div.appendChild(s);
    }

    return;
  }

  if (a.tipo === "permiso") {
    tarjeta("ambar", "pide permiso", a.descripcion || a.herramienta || "");
  }
}

// El servidor apunta lo que hace; esto lo va pidiendo. Es local y barato.

// Python inyecta los datos en el HTML antes de abrirlo. Por la URL no se
// puede: en Windows `webbrowser` acaba en `os.startfile`, el shell resuelve

if (window.DATOS_ARQUITECTO && window.DATOS_ARQUITECTO.ms) {

// --- La camara: que te siga a ti, no al raton ---------------------------------
//
// `getUserMedia` exige contexto seguro. `file://` no lo es y `localhost`
// si, que es la razon de que esto se sirva por HTTP en vez de abrirse como
// archivo. Sin servidor, esta parte entera no existe y se sigue el raton.
//
// No se carga ninguna libreria de vision. Con noventa y seis por setenta y
// dos pixeles bastan dos senales:
//
//   - **Movimiento**: la diferencia con el cuadro anterior. Una mano que
//     saluda la enciende entera, asi que si hay movimiento fuerte se
//     asume que es un gesto deliberado y manda sobre lo demas.
//   - **Piel**: el clasico umbral en RGB. Cuando estas quieto no hay
//     movimiento que seguir, pero tu cara sigue ahi.
//
// No es reconocimiento facial y no conviene llamarlo asi: es una mancha de
// color. Basta para que la cabeza te siga; para leer expresiones haria
// falta un modelo de verdad.

const camara = { activa: false, que: "raton", x: 0, y: 0 };

const MUESTRA_ANCHO = 96;
const MUESTRA_ALTO = 72;

// Cuanta diferencia acumulada cuenta como "alguien esta moviendo algo".
const UMBRAL_MOVIMIENTO = 26000;

const MINIMO_PIEL = 55;

async function encenderCamara() {
  if (!window.isSecureContext || !navigator.mediaDevices) return;

  let flujo;

  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240, facingMode: "user" },
      audio: false,
    });

  } catch (e) {
    return;                       // sin permiso se sigue con el raton
  }

  const video = document.createElement("video");

  camara.video = video;
  video.srcObject = flujo;
  video.muted = true;
  video.playsInline = true;

  await video.play();

  const hoja = document.createElement("canvas");

  hoja.width = MUESTRA_ANCHO;
  hoja.height = MUESTRA_ALTO;

  const pincel = hoja.getContext("2d", { willReadFrequently: true });

  let anteriorCuadro = null;

  camara.activa = true;

  setInterval(function () {
    pincel.drawImage(video, 0, 0, MUESTRA_ANCHO, MUESTRA_ALTO);

    const cuadro = pincel.getImageData(0, 0, MUESTRA_ANCHO, MUESTRA_ALTO).data;

    mirar(cuadro, anteriorCuadro);

    anteriorCuadro = cuadro;
  }, 70);
}

function mirar(ahora, antes) {
  let mx = 0, my = 0, peso = 0;
  let px = 0, py = 0, piel = 0;

  for (let i = 0, n = 0; i < ahora.length; i += 4, n++) {
    const r = ahora[i], g = ahora[i + 1], b = ahora[i + 2];

    const x = n % MUESTRA_ANCHO;
    const y = (n / MUESTRA_ANCHO) | 0;

    if (antes) {
      const d = Math.abs(r - antes[i]) +
                Math.abs(g - antes[i + 1]) +
                Math.abs(b - antes[i + 2]);

      if (d > 58) { mx += x * d; my += y * d; peso += d; }
    }

    const mayor = Math.max(r, g, b);
    const menor = Math.min(r, g, b);

    if (r > 95 && g > 40 && b > 20 && mayor - menor > 15 && r - g > 15 && r > b) {
      px += x; py += y; piel++;
    }
  }

  let cx, cy, que;

  if (peso > UMBRAL_MOVIMIENTO) {
    cx = mx / peso; cy = my / peso; que = "tu mano";

  } else if (piel > MINIMO_PIEL) {
    cx = px / piel; cy = py / piel; que = "tu cara";

  } else {
    camara.que = "buscandote";

    return;
  }

  // Espejo en horizontal: si te mueves a tu derecha, la cara mira hacia
  // alli. Sin invertir se siente al reves y desconcierta.
  const destinoX = -((cx / MUESTRA_ANCHO) - 0.5) * 2;
  const destinoY = ((cy / MUESTRA_ALTO) - 0.5) * 2;

  // Suavizado fuerte: la senal de una camara es ruidosa y una cabeza que
  // tirita no parece que te mire, parece que le pasa algo.
  camara.x += (destinoX - camara.x) * 0.16;
  camara.y += (destinoY - camara.y) * 0.16;
  camara.que = que;
}

encenderCamara();

// --- El oido: hablarle en vez de escribirle ----------------------------------
//
// Hasta aqui la cara veia pero no oia, y eso no se nota hasta que alguien
// se pone a hablarle delante y no pasa nada.
//
// Se usa el reconocimiento del propio navegador. Conviene decir lo que
// implica: **Chrome manda el audio a los servidores de Google** para
// transcribirlo. No es local. La alternativa es grabar aqui y transcribir
// con Whisper desde Python — mas privado respecto a Google, aunque el
// audio acabe igualmente en OpenAI, y de pago.
//
// Lo que se oye se escribe en pantalla siempre. Si entiende otra cosa, se
// ve al momento; sin eso, "no me escucha" y "te oyo mal" son lo mismo.

const oido = document.getElementById("oido");

let escuchando = null;
let ocupado = false;

// El temporizador que devuelve la escucha cuando termina de hablar. Se
// guarda para poder cancelarlo si se le corta a media frase.
let volverAEscuchar = null;

function mostrarOido(texto, seguro) {
  if (!texto) {
    oido.classList.remove("se-ve");

    return;
  }

  oido.innerHTML = seguro ? texto : "<i>" + texto + "</i>";
  oido.classList.add("se-ve");
}

function hablando() {
  return estado.modo === "hablando";
}

// Lo que se hace al terminar de hablar, o al cortarlo.
let escucharDeNuevo = function () {
  if (cerrando) return;

  clearTimeout(volverAEscuchar);
  volverAEscuchar = null;
  ocupado = false;
  arquitecto.escuchar();

  if (porDecir.length) {
    const a = porDecir.shift();

    ocupado = true;
    procesarRespuesta({ respuesta: a.respuesta, dicho: a.dicho, ms: a.ms, audio: a.audio }, 600, true);

    return;
  }

  if (escuchando) { try { escuchando.start(); } catch (e) { /* ya estaba */ } }
};

// Dice la respuesta y programa la vuelta a escuchar. `margen` son los
// milisegundos de mas que se esperan: el reloj de aqui y el del audio
// —que lo pone Python— no van a la par, y quedarse corto es oir el final
// de la propia frase y contestarse solo.
function decir(datos, margen) {
  ocupado = true;
  pararSonido();
  arquitecto.hablar(datos.ms || 1200, datos.dicho || datos.respuesta || "");

  clearTimeout(volverAEscuchar);

  // El audio suena aqui, no en Python: asi Chrome cancela su propia voz
  // del microfono y se sabe el instante exacto en que termina.
  if (datos.audio) {
    const pista = new Audio(datos.audio);

    sonando = pista;

    pista.onended = function () {
      if (sonando !== pista) return;

      sonando = null;
      setTimeout(escucharDeNuevo, 250);
    };

    pista.onerror = function () { sonarEnElServidor(datos.audio); };
    pista.play().catch(function () { sonarEnElServidor(datos.audio); });

    // Por si el navegador nunca avisa del final.
    volverAEscuchar = setTimeout(escucharDeNuevo, (datos.ms || 1200) + margen + 2000);

    return;
  }

  volverAEscuchar = setTimeout(escucharDeNuevo, (datos.ms || 1200) + margen);
}

// La pista que esta sonando ahora, para poder cortarla.
let sonando = null;

function pararSonido() {
  if (!sonando) return;

  try { sonando.pause(); } catch (e) { /* ya parada */ }

  sonando = null;
}

// El navegador bloqueo la reproduccion (autoplay): que suene en el servidor.
function sonarEnElServidor(url) {
  sonando = null;

  fetch("/sonar?" + (url.split("?")[1] || ""), { method: "POST" }).catch(function () {});
}

// Una respuesta con resguardo se recoge cuando esta. Devuelve la respuesta
// final, o null si se perdio por el camino (ya se aviso en pantalla).
async function recoger(datos) {
  if (!datos.resguardo) return datos;

  // Con tope. Una espera sin limite es como se quedo colgado: la pagina
  // pidiendo una respuesta que ya no iba a llegar, y sin forma de salir
  // mas que cerrandola.
  const corte = new AbortController();
  const reloj = setTimeout(function () { corte.abort(); }, 200000);

  try {
    const recogida = await fetch("/respuesta?r=" + datos.resguardo, {
      signal: corte.signal,
    });

    return Object.assign({ oido: datos.oido }, await recogida.json());

  } catch (e) {
    mostrarOido(
      e.name === "AbortError"
        ? "Se me fue el santo al cielo. Dimelo otra vez."
        : "Se corto mientras lo hacia: " + e.message,
      true
    );

    escucharDeNuevo();

    return null;

  } finally {
    clearTimeout(reloj);
  }
}

// Que hacer con lo que llego mientras el hablaba. Lo decide el servidor:
// si era su propia voz por los altavoces la descarta; si eras tu, corta el
// audio y te atiende. Aqui solo se sabe si aquello llego a algo.
function tratarInterrupcion(datos) {
  if (datos.error === "eco" || datos.ajeno) return false;

  pararSonido();

  if (datos.callado) {
    escucharDeNuevo();

    return false;
  }

  // Le cortaste con una orden nueva: deja de gesticular y se pone a pensar.
  clearTimeout(volverAEscuchar);
  ocupado = true;
  arquitecto.pensar();

  return true;
}

// Su nombre, aunque llegue recortado o con muletilla.
// Cuando algo no iba para el, decir por que: sin la pista parece sordo.
function noEraParaMi(texto) {
  const pista = AJUSTES.modo_oido === "nombre" ? " (di \u00abArchitect\u00bb primero)" : "";

  return "<i>" + escapar(texto || "") + "</i> \u2014 no era para mi" + pista;
}

function esSuNombre(texto) {
  return /^(oye |hey |hola |ey )?ar(qu|ch|k)itec/i.test(texto.trim());
}

function conversar() {
  const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Reconocedor) {
    rotulo.textContent = "sin oido en este navegador";
    mostrarOido("Este navegador no reconoce voz. Prueba con Chrome.", true);

    return;
  }

  escuchando = new Reconocedor();

  escuchando.lang = "es-CO";
  escuchando.continuous = true;
  escuchando.interimResults = true;

  escuchando.onstart = function () {
    if (!ocupado) arquitecto.escuchar();
  };

  escuchando.onresult = function (e) {
    let firme = "", suelto = "";

    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) firme += e.results[i][0].transcript;
      else suelto += e.results[i][0].transcript;
    }

    if (suelto && !ocupado) {
      arquitecto.despertar();
      mostrarOido(suelto, false);
    }

    const orden = firme.trim();

    if (!orden) return;

    // Pensando no se oye: lo que llegue ahora es la orden anterior
    // repetida o ruido. Hablando si, para poder cortarlo.
    if (ocupado && !hablando()) return;

    const interrumpe = hablando();

    // Dos palabras minimo: un carraspeo o un "ya" suelto no es una orden.
    // Salvo su nombre, que es una sola y es llamarlo.
    // Esperando un permiso, un «si» solo es una respuesta entera.
    if (!interrumpe && !estado.pidiendo &&
        orden.split(/\s+/).length < 2 && !esSuNombre(orden)) return;

    if (!interrumpe) mostrarOido(orden, true);

    enviarOrden(orden, interrumpe);
  };

  escuchando.onerror = function (e) {
    if (e.error === "not-allowed") {
      rotulo.textContent = "sin permiso de microfono";
      mostrarOido("Dale permiso al microfono y recarga.", true);
    }
  };

  // Chrome corta la escucha sola cada cierto tiempo, y ahora tampoco se
  // para mientras habla —para poder cortarlo—. Siempre se vuelve a arrancar.
  escuchando.onend = function () {
    try { escuchando.start(); } catch (e) { /* ya estaba */ }
  };

  try { escuchando.start(); } catch (e) { /* ya estaba */ }
}

async function enviarOrden(texto, interrumpe) {
  if (!interrumpe) {
    ocupado = true;
    arquitecto.pensar();
  }

  let datos;

  try {
    const respuesta = await fetch("/orden", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: texto, interrumpe: !!interrumpe }),
    });

    datos = await respuesta.json();

  } catch (e) {
    if (interrumpe) return;

    mostrarOido("No pude hablar con el arquitecto: " + e.message, true);
    escucharDeNuevo();

    return;
  }

  if (interrumpe) {
    if (!tratarInterrupcion(datos)) return;

    mostrarOido(texto, true);

  } else if (datos.ajeno) {
    // No era para el: alguien hablando cerca, la tele. Se vuelve a
    // escuchar sin decir nada.
    mostrarOido(noEraParaMi(datos.oido || texto), true);
    escucharDeNuevo();

    return;

  } else if (datos.error === "eco") {
    escucharDeNuevo();

    return;
  }

  // Desde la fase 4 esta via tambien contesta con un resguardo y hace la
  // faena aparte: la cara no se queda congelada en una orden larga.
  datos = await recoger(datos);

  if (!datos) return;

  procesarRespuesta(datos, 700, true);
}

// Lo que se hace con una respuesta, venga de donde venga: la ventana, el
// panel, el permiso (ambar) o su resolucion, y decirla.
// Lo que Architect quiere decir por su cuenta (una reparacion que termino,
// el celular recien conectado) espera a que no este ocupado.
const porDecir = [];

function pedirDato(p) {
  const caja = document.getElementById("dato");
  const campo = document.getElementById("dato-valor");

  document.getElementById("dato-etiqueta").textContent = p.etiqueta || p.clave;
  campo.type = p.secreto ? "password" : "text";
  campo.value = "";
  caja.dataset.clave = p.clave;
  caja.classList.add("se-ve");
  campo.focus();
}

async function entregarDato() {
  const caja = document.getElementById("dato");
  const campo = document.getElementById("dato-valor");
  const clave = caja.dataset.clave || "";
  const valor = campo.value;

  caja.classList.remove("se-ve");
  campo.value = "";

  let datos;

  try {
    const r = await fetch("/dato", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clave: clave, valor: valor }),
    });

    datos = await r.json();

  } catch (e) {
    mostrarOido("No pude guardar el dato: " + e.message, true);

    return;
  }

  procesarRespuesta(datos, 600, true);
}

document.getElementById("dato-ok").addEventListener("click", entregarDato);
document.getElementById("dato-valor").addEventListener("keydown", function (e) {
  if (e.key === "Enter") entregarDato();
});

// «Cierra Architect»: se deja de escuchar y, cuando termina de despedirse,
// la pagina se cierra (el servidor se apaga solo). Si el navegador no deja
// cerrar la pestana, queda en pausa y lo dice.
let cerrando = false;

function cerrarSesion() {
  cerrando = true;
  ocupado = true;

  if (escuchando) { try { escuchando.stop(); escuchando.onend = null; } catch (e) { /* ya */ } }

  rotulo.textContent = "cerrado";
  mostrarOido("Sesi\u00f3n cerrada. Puedes cerrar esta ventana.", true);

  setTimeout(function () { try { window.close(); } catch (e) { /* no deja */ } }, 400);
}

function procesarRespuesta(datos, margen, mostrar) {
  if (datos.pedir && datos.pedir.clave) pedirDato(datos.pedir);

  if (datos.rostro === "reposo") {
    estado.formado = false;
    estado.ultimaInteraccion = 0;
  }

  if (datos.cerrar) {
    // Se despide primero; al terminar el audio, se cierra en vez de escuchar.
    const original = escucharDeNuevo;

    escucharDeNuevo = function () { escucharDeNuevo = original; cerrarSesion(); };
  }

  if (datos.ventana) ordenarVentana(datos.ventana);

  if (datos.panel) mostrarPanel(datos.panel);

  if (datos.permiso_resuelto) arquitecto.permisoResuelto(datos.permiso_resuelto === "si");

  if (!datos.respuesta) {
    escucharDeNuevo();

    return;
  }

  if (mostrar) mostrarOido(datos.respuesta, true);

  decir(datos, margen);

  if (datos.permiso && datos.permiso.length) arquitecto.permiso(datos.permiso);

  // «Que ves»: se toma un fotograma de la camara y se manda a describir.
  if (datos.mirar) mirarConLaCamara(datos.mirar);
}

async function mirarConLaCamara(pregunta) {
  let imagen = "";

  if (camara.video) {
    const foto = document.createElement("canvas");

    foto.width = 640;
    foto.height = 480;
    foto.getContext("2d").drawImage(camara.video, 0, 0, 640, 480);
    imagen = foto.toDataURL("image/jpeg", 0.7);
  }

  ocupado = true;

  try {
    const r = await fetch("/mirar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imagen: imagen, pregunta: pregunta }),
    });

    procesarRespuesta(await r.json(), 600, true);

  } catch (e) {
    mostrarOido("No pude mirar: " + e.message, true);
    escucharDeNuevo();
  }
}

// --- La ventana flotante -----------------------------------------------------
//
// Oir "puntuacion 99.26, cuarenta y una incidencias" y que se quede en el
// aire no es lo mismo que verlo. Esto lo deja en pantalla, en miniatura,
// para poder volver a mirarlo.
//
// Se agranda con doble clic o diciendoselo. Lo segundo no pasa por el
// modelo: "ampliala" se resuelve en el sitio, porque mandar a un modelo la
// orden de mover una caja que ya esta en pantalla son dos segundos de
// espera para nada.

const panel = document.getElementById("panel");

let panelActual = null;
let relojVivo = null;

function mostrarPanel(datos) {
  panelActual = datos;

  panel.innerHTML = pintarPanel(datos);
  panel.classList.add("se-ve");

  clearInterval(relojVivo);

  // El reloj sigue corriendo: una hora congelada en pantalla es peor que
  // no tenerla, porque parece buena y no lo es.
  if (datos.tipo === "reloj") {
    relojVivo = setInterval(function () {
      const ahora = new Date();
      const hh = String(ahora.getHours()).padStart(2, "0");
      const mm = String(ahora.getMinutes()).padStart(2, "0");
      const ss = String(ahora.getSeconds()).padStart(2, "0");

      const donde = panel.querySelector(".cifra");

      if (donde) donde.innerHTML = hh + ":" + mm + "<small>" + ss + "</small>";
    }, 1000);
  }
}

function escapar(texto) {
  return String(texto === null || texto === undefined ? "" : texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function pintarPanel(d) {
  const titulo = "<h4>" + escapar(d.titulo || "") + "</h4>";
  const ojo = '<div class="ojo">doble clic para ampliar</div>';

  let cuerpo = "";

  if (d.tipo === "reloj") {
    cuerpo =
      '<div class="cifra">' + escapar(d.hora) +
      "<small>" + escapar(d.segundos) + "</small></div>" +
      '<div class="pie-panel">' + escapar(d.fecha) + "</div>";

  } else if (d.tipo === "puntuacion") {
    cuerpo =
      '<div class="cifra">' + escapar(d.valor) + "<small>/100</small></div>" +
      '<div class="pie-panel">' + escapar(d.incidencias) + " incidencias" +
      (d.veredicto ? " · " + escapar(d.veredicto) : "") + "</div>";

  } else if (d.tipo === "hallazgos") {
    const lista = (d.con_hallazgos || [])
      .map(function (a) { return "<li><b>" + escapar(a) + "</b></li>"; })
      .join("");

    cuerpo =
      '<div class="cifra">' + escapar(d.total) + "</div>" +
      '<div class="pie-panel">hallazgos de ' + escapar(d.agentes) +
      " agentes</div><ul>" + lista + "</ul>";

  } else if (d.tipo === "estado") {
    const filas = Object.entries(d.componentes || {})
      .map(function (par) {
        return "<li>" + escapar(par[0]) + "<b>" + escapar(par[1]) + "</b></li>";
      })
      .join("");

    cuerpo =
      '<div class="cifra" style="font-size:26px">' + escapar(d.estado) +
      "</div><ul>" + filas + "</ul>";

  } else if (d.tipo === "cambio") {
    cuerpo =
      '<div class="cifra">' + escapar(d.valor) + "</div>" +
      '<div class="pie-panel">' + escapar(d.par) + "</div>" +
      '<div class="pie-panel">' + escapar(d.fecha) + "</div>";

  } else if (d.tipo === "estructura") {
    cuerpo =
      '<div class="cifra">' + escapar(d.archivos) + "<small>archivos</small></div>" +
      "<ul><li>líneas<b>" + escapar(d.lineas) + "</b></li>" +
      "<li>funciones<b>" + escapar(d.funciones) + "</b></li></ul>";

  } else {
    cuerpo = "<pre>" + escapar(d.cuerpo) + "</pre>";
  }

  return titulo + cuerpo + ojo;
}

function ordenarVentana(orden) {
  if (orden === "cerrar") {
    panel.classList.remove("se-ve", "grande");
    clearInterval(relojVivo);

    return;
  }

  if (!panelActual) return;                 // no hay nada que agrandar

  panel.classList.add("se-ve");
  panel.classList.toggle("grande", orden === "ampliar");
}

panel.addEventListener("dblclick", function () {
  panel.classList.toggle("grande");
});

// Arrastrable: si tapa la cara, se aparta.
(function () {
  let cogido = false, dx = 0, dy = 0;

  panel.addEventListener("pointerdown", function (e) {
    cogido = true;
    dx = e.clientX - panel.offsetLeft;
    dy = e.clientY - panel.offsetTop;
    panel.setPointerCapture(e.pointerId);
  });

  panel.addEventListener("pointermove", function (e) {
    if (!cogido) return;

    panel.style.left = (e.clientX - dx) + "px";
    panel.style.top = (e.clientY - dy) + "px";
    panel.style.right = "auto";
  });

  panel.addEventListener("pointerup", function () { cogido = false; });
})();

// --- Oir con Whisper ---------------------------------------------------------
//
// El reconocedor de Chrome es gratis pero entiende el espanol regular y
// manda el audio a Google. Esto graba aqui y lo transcribe OpenAI, que
// ademas acepta contexto: pasandole los nombres de los comandos deja de
// oir "revista" donde dices "revisa".
//
// Lo que se paga es por minuto de audio, asi que **no se manda el
// silencio**. Un medidor de volumen decide cuando empiezas y cuando
// paras, y solo ese trozo sale de aqui. Una conversacion de una hora con
// diez ordenes son diez segundos de audio, no una hora.

// Por encima de esto se considera que hay voz. Subido a proposito: quien
// habla es el que esta delante del microfono, y con el umbral bajo entraba
// la television, la conversacion de al lado y el pasillo. Lo lejano queda
// por debajo; lo tuyo, no.
const UMBRAL_VOZ = 0.045;

// Mientras el habla, el audio sale de esta misma pagina y Chrome lo resta
// del microfono (echoCancellation); lo que queda de eco es poco. Aun asi,
// para cortarlo se pide algo mas de voz que en silencio, y lo que pase lo
// juzga el servidor, que sabe que acaba de decir.
const UMBRAL_INTERRUPCION = 0.065;

// Cuanto silencio cierra la frase. Menos corta las pausas al pensar;
// mas y hay que esperar mirando la pantalla.
const SILENCIO_FINAL = 900;

// Voz sostenida minima para que cuente como orden, y no una tos.
const VOZ_MINIMA = 280;

// Cuanto audio anterior al primer sonido se conserva. Sin esto la primera
// palabra llegaba cortada —"arquitect"— y la palabra de activacion nunca
// entraba entera.
const PREVIO = 450;

// A lo que se graba. Whisper trabaja a 16 kHz; mandar mas es pagar por nada.
const HERCIOS = 16000;

// Trozos de Int16 -> un WAV mono de 16 bits, que OpenAI entiende tal cual.
function aWav(trozos) {
  let total = 0;

  for (const t of trozos) total += t.length;

  const buffer = new ArrayBuffer(44 + total * 2);
  const vista = new DataView(buffer);

  const texto = function (pos, s) {
    for (let i = 0; i < s.length; i++) vista.setUint8(pos + i, s.charCodeAt(i));
  };

  texto(0, "RIFF");
  vista.setUint32(4, 36 + total * 2, true);
  texto(8, "WAVE");
  texto(12, "fmt ");
  vista.setUint32(16, 16, true);
  vista.setUint16(20, 1, true);
  vista.setUint16(22, 1, true);
  vista.setUint32(24, HERCIOS, true);
  vista.setUint32(28, HERCIOS * 2, true);
  vista.setUint16(32, 2, true);
  vista.setUint16(34, 16, true);
  texto(36, "data");
  vista.setUint32(40, total * 2, true);

  let pos = 44;

  for (const t of trozos) {
    for (let i = 0; i < t.length; i++, pos += 2) vista.setInt16(pos, t[i], true);
  }

  return new Blob([buffer], { type: "audio/wav" });
}

async function escucharConWhisper() {
  let flujo;

  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });

  } catch (e) {
    rotulo.textContent = "sin permiso de microfono";
    mostrarOido("Dale permiso al microfono y recarga la pagina.", true);

    return;
  }

  const sonido = new (window.AudioContext || window.webkitAudioContext)();
  const fuente = sonido.createMediaStreamSource(flujo);
  const medidor = sonido.createAnalyser();

  medidor.fftSize = 1024;
  fuente.connect(medidor);

  const muestras = new Float32Array(medidor.fftSize);

  // Grabadora propia, en PCM crudo. MediaRecorder no vale para guardar lo
  // de antes de que empieces a hablar: sus trozos solo se entienden a
  // partir del primero, asi que no se puede empezar "medio segundo atras".
  const paso = sonido.sampleRate / HERCIOS;
  const previos = [];            // lo ultimo oido, por si empieza una frase
  let previosMuestras = 0;
  let grabando = null;           // los trozos de la frase en curso
  let mientrasHablaba = false;   // si la frase empezo con el hablando

  const captura = sonido.createScriptProcessor(4096, 1, 1);

  captura.onaudioprocess = function (e) {
    const entrada = e.inputBuffer.getChannelData(0);
    const salida = new Int16Array(Math.floor(entrada.length / paso));

    for (let i = 0; i < salida.length; i++) {
      // Promedio del tramo, no una muestra suelta: decimar sin promediar
      // mete ruido.
      const desde = Math.floor(i * paso);
      const hasta = Math.max(desde + 1, Math.floor((i + 1) * paso));

      let s = 0;

      for (let j = desde; j < hasta; j++) s += entrada[j];

      const v = Math.max(-1, Math.min(1, s / (hasta - desde)));

      salida[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
    }

    if (grabando) {
      grabando.push(salida);

      return;
    }

    previos.push(salida);
    previosMuestras += salida.length;

    while (previosMuestras > HERCIOS * PREVIO / 1000 && previos.length > 1) {
      previosMuestras -= previos.shift().length;
    }
  };

  // El procesador solo corre conectado a la salida; se conecta en silencio
  // para no oirte a ti mismo por los altavoces.
  const mudo = sonido.createGain();

  mudo.gain.value = 0;
  fuente.connect(captura);
  captura.connect(mudo);
  mudo.connect(sonido.destination);

  let vozAcumulada = 0;
  let calladoDesde = 0;

  arquitecto.escuchar();

  setInterval(function () {
    // Pensando o esperando la respuesta no se oye: lo que llegue es ruido.
    // Hablando si, para poder cortarlo.
    if (ocupado && !hablando()) {
      grabando = null;
      vozAcumulada = 0;
      calladoDesde = 0;

      return;
    }

    medidor.getFloatTimeDomainData(muestras);

    let suma = 0;

    for (let i = 0; i < muestras.length; i++) suma += muestras[i] * muestras[i];

    const volumen = Math.sqrt(suma / muestras.length);
    const ahora = performance.now();
    const umbral = hablando() ? UMBRAL_INTERRUPCION : UMBRAL_VOZ;

    if (volumen > umbral) {
      calladoDesde = 0;
      vozAcumulada += 60;

      // Una voz: la nebulosa se hace rostro y te mira.
      if (vozAcumulada >= 180) arquitecto.despertar();

      if (!grabando) {
        // Se empieza con lo que ya estaba sonando: la primera silaba entera.
        grabando = previos.splice(0);
        previosMuestras = 0;
        vozAcumulada = 60;
        mientrasHablaba = hablando();
      }

      return;
    }

    if (!grabando) return;

    if (!calladoDesde) calladoDesde = ahora;

    if (ahora - calladoDesde < SILENCIO_FINAL) return;

    // Se acabo la frase.
    const suficiente = vozAcumulada >= (estado.pidiendo ? 160 : VOZ_MINIMA);
    const trozos = grabando;
    const interrumpe = mientrasHablaba;

    grabando = null;
    calladoDesde = 0;
    vozAcumulada = 0;

    if (!suficiente || !trozos.length) return;      // una tos, un golpe

    enviarAudio(aWav(trozos), interrumpe);
  }, 60);
}

async function enviarAudio(audio, interrumpe) {
  if (!interrumpe) {
    ocupado = true;
    arquitecto.pensar();
    mostrarOido("...", false);
  }

  let datos;

  try {
    const respuesta = await fetch("/oir", {
      method: "POST",
      headers: {
        "Content-Type": "audio/wav",
        // Quien manda es la ultima pestana que se abrio. Con dos abiertas
        // habia dos micros encendidos: mientras una hablaba, la otra la
        // oia por los altavoces y la devolvia como si fuera una orden.
        "X-Turno": AJUSTES.turno || "",
        // Si llego mientras el hablaba: el servidor decide si era su eco
        // o si eras tu cortandolo.
        "X-Interrumpe": interrumpe ? "1" : "0",
      },
      body: audio,
    });

    datos = await respuesta.json();

  } catch (e) {
    if (interrumpe) return;

    mostrarOido("No pude hablar con el arquitecto: " + e.message, true);
    escucharDeNuevo();

    return;
  }

  if (datos.detener) {
    // Se abrio la cara en otra pestana. Esta se calla en vez de pelearse
    // por el microfono, y lo dice para que no parezca averiada.
    clearTimeout(volverAEscuchar);
    ocupado = true;
    rotulo.textContent = "en pausa";
    mostrarOido("Hay otra ventana escuchando. Cierra esta.", true);

    return;                                   // ocupado se queda en true
  }

  if (interrumpe && !tratarInterrupcion(datos)) return;

  if (datos.oido) mostrarOido(datos.oido, true);

  // No era para el: alguien hablando cerca, la tele, el telefono. Ni se
  // ejecuta ni se contesta, y se vuelve a escuchar sin decir nada.
  if (datos.ajeno) {
    mostrarOido(noEraParaMi(datos.oido), true);
    escucharDeNuevo();

    return;
  }

  // El servidor contesta al momento con un resguardo y hace la faena
  // aparte. Antes esta peticion tardaba lo que tardara el comando —hasta
  // medio minuto con los agentes— y en todo ese rato la cara no decia ni
  // hacia nada. Ahora se sabe enseguida que se te oyo, y la respuesta se
  // recoge cuando esta.
  datos = await recoger(datos);

  if (!datos) return;

  // Con el audio sonando en la pagina el margen ya no tiene que tapar el
  // desfase de dos relojes; queda uno corto por cortesia.
  procesarRespuesta(datos, 600, false);
}

const AJUSTES = window.DATOS_ARQUITECTO || {};

if (AJUSTES.modo === "conversacion") {
  if (AJUSTES.modo_oido === "nombre") {
    mostrarOido(
      "Di \u00abArchitect\u00bb y lo que quieras. Si habla, c\u00f3rtalo habl\u00e1ndole encima.",
      true
    );
  }

  if (AJUSTES.oido === "whisper") escucharConWhisper();
  else conversar();

  vigilarProgreso();
}

// --- El bucle ----------------------------------------------------------------

let anterior = 0;

function fotograma(ahora) {
  const reloj = ahora / 1000;
  const paso = Math.min(0.05, (ahora - anterior) / 1000) || 0.016;

  anterior = ahora;

  gesticular(ahora);
  parpadear(ahora, paso);

  // Suavizado: los musculos no saltan, llegan.
  // Pensando se deshace en nebulosa; en cuanto va a contestar, vuelve a
  // ser una cara. Se deshace despacio —0.028— y se rehace mas deprisa
  // —0.075—: costar recomponerse mas de lo que cuesta perderse se lee como
  // desgana, y lo que tiene que parecer es que vuelve porque tiene algo
  // que decir.
  // La nebulosa ya no es "pensando": es el reposo. Formado, la cara se
  // queda entera mientras escucha, piensa, trabaja o habla; si lleva un
  // rato sin que le hablen, se deshace otra vez.
  if (estado.formado && !estado.pidiendo &&
      (estado.modo === "escuchando" || estado.modo === "reposo") &&
      ahora - estado.ultimaInteraccion > REPOSO_MS) {
    estado.formado = false;
    rotulo.textContent = estado.modo === "escuchando" ? "en reposo \u00b7 escuchando" : "en reposo";
  }

  estado.objetivoDispersion = estado.formado ? 0 : 1;

  // El tinte de la fase: ambar si espera permiso, cian trabajando.
  const quiere = estado.pidiendo ? TINTES.pidiendo
               : estado.modo === "trabajando" ? TINTES.trabajando
               : { r: 255, g: 255, b: 255, k: 0 };

  estado.tinte.k += (quiere.k - estado.tinte.k) * 0.06;

  if (quiere.k > 0) {
    estado.tinte.r += (quiere.r - estado.tinte.r) * 0.08;
    estado.tinte.g += (quiere.g - estado.tinte.g) * 0.08;
    estado.tinte.b += (quiere.b - estado.tinte.b) * 0.08;
  }

  estado.dispersion += (estado.objetivoDispersion - estado.dispersion) *
                       (estado.objetivoDispersion > estado.dispersion ? 0.028 : 0.075);

  estado.apertura += (estado.objetivoApertura - estado.apertura) * 0.28;
  estado.redondeo += (estado.objetivoRedondeo - estado.redondeo) * 0.18;
  estado.cejas += (estado.objetivoCejas - estado.cejas) * 0.10;

  // La camara manda sobre el raton cuando hay algo que seguir.
  const sigueCamara = camara.activa && camara.que !== "buscandote";

  const miraX = sigueCamara ? camara.x : estado.ratonX;
  const miraY = sigueCamara ? camara.y : estado.ratonY;

  estado.giro += (miraX * 0.50 - estado.giro) * 0.045;
  estado.giro += sigueCamara ? 0 : 0.0011;      // sin nadie delante, deriva sola

  // Deshecho gira mas: una nube quieta no parece que este pensando, parece
  // que se ha colgado. Y al rehacerse el giro se calma solo, porque
  // depende de lo deshecho que este.
  estado.giro += estado.dispersion * 0.0042;
  estado.inclina += (miraY * 0.26 - estado.inclina) * 0.045;

  const fuente = camara.activa ? "siguiendo " + camara.que : "raton";

  if (fuente !== ultimaFuente) {
    ultimaFuente = fuente;
    pie.textContent = "espacio · hablar     " + fuente;
  }

  dibujar(reloj);

  requestAnimationFrame(fotograma);
}

function gesticular(ahora) {
  if (estado.modo !== "hablando") {
    estado.objetivoApertura = estado.modo === "escuchando" ? 0.05 : 0;
    estado.objetivoRedondeo = 0;

    // Escuchando levanta las cejas —atencion—; pensando las baja y las
    // junta. Son dos gestos distintos y se leen sin explicarlos.
    estado.objetivoCejas = estado.modo === "escuchando" ? 0.35
                         : estado.modo === "pensando" ? -0.30
                         : estado.modo === "trabajando" ? -0.15 : 0;
    estado.cabeceo *= 0.94;

    return;
  }

  if (ahora > estado.hasta) {
    arquitecto.reposo();

    return;
  }

  const t = ahora - estado.empezo;

  const silaba = estado.guion.find(s => t >= s.desde && t < s.desde + s.dura);

  if (!silaba) {
    // Sin texto solo se sabe cuanto dura, asi que se finge un ritmo. Se
    // nota menos que dejar la boca quieta, y se dice que es asi.
    const r = ahora / 1000;

    estado.objetivoApertura = 0.30 + 0.30 * Math.abs(
      Math.sin(r * 10.7) * 0.6 + Math.sin(r * 6.3) * 0.4
    );
    estado.objetivoRedondeo = 0.2;

    return;
  }

  const avance = (t - silaba.desde) / silaba.dura;

  // Dentro de cada silaba: cierre, ataque, sostenimiento y caida. Sin la
  // fase de cierre las palabras se funden y parece que masca.
  let sobre;

  if (avance < 0.14) sobre = (1 - silaba.cierra) * (avance / 0.14);
  else if (avance < 0.42) sobre = (avance - 0.14) / 0.28;
  else if (avance < 0.72) sobre = 1;
  else sobre = 1 - (avance - 0.72) / 0.28;

  estado.objetivoApertura = silaba.abre * Math.max(0, Math.min(1, sobre)) * 0.92;
  estado.objetivoRedondeo = silaba.redondo;

  // Las cejas acompanan lo abierto de la vocal: no es adorno, es lo que
  // separa hablar de mover la mandibula.
  estado.objetivoCejas = silaba.abre * 0.55;

  // Y la cabeza asiente con el ritmo.
  estado.cabeceo = estado.cabeceo * 0.86 + silaba.abre * 0.020 * Math.sin(avance * Math.PI);
}

function parpadear(ahora, paso) {
  estado.proximoParpadeo -= paso * 1000;

  if (estado.proximoParpadeo <= 0) {
    estado.parpadeo = 1;
    estado.proximoParpadeo = 2200 + Math.random() * 4200;
  }

  estado.parpadeo = Math.max(0, estado.parpadeo - paso * 7.5);
}

// --- Dibujar -----------------------------------------------------------------

const visibles = [];

function dibujar(reloj) {
  ctx.fillStyle = "#04030c";
  ctx.fillRect(0, 0, ancho, alto);
  ctx.globalCompositeOperation = "lighter";

  const inclina = estado.inclina + estado.cabeceo;

  const cosY = Math.cos(estado.giro), senY = Math.sin(estado.giro);
  const cosX = Math.cos(inclina), senX = Math.sin(inclina);

  const cx = ancho / 2;
  const cy = alto / 2 + alto * 0.02;

  const respira = Math.sin(reloj * 0.75) * 0.010;

  visibles.length = 0;

  // Cuanto se ha deshecho el rostro ahora mismo. Fuera del bucle: son seis
  // mil particulas y esto no depende de ninguna.
  const deshecho = estado.dispersion;

  for (const p of particulas) {
    // La deriva: cada particula flota a su ritmo alrededor de su sitio.
    // Es lo unico que separa una nebulosa de una constelacion.
    const d = reloj * p.vel + p.fase;

    let x = p.bx + Math.sin(d) * p.vaiven;
    let y = p.by + Math.cos(d * 0.83) * p.vaiven + respira;
    let z = p.bz + Math.sin(d * 0.61) * p.vaiven * 0.7;

    let alfa = p.brillo;

    // --- Deshacerse y volver ---------------------------------------------
    //
    // Pensando, el rostro se abre en nebulosa; al ir a contestar, vuelve.
    // Cada particula sale con su propio retraso, asi que la cara no se
    // desvanece de golpe: se deshace. Y al volver, las que salieron antes
    // llegan antes, que es como se recompone algo de verdad.
    if (deshecho > 0.001 && p.clase !== "estrella") {
      const suyo = Math.min(1, Math.max(0, (deshecho - p.retraso * 0.4) / 0.6));

      // Suavizado en las dos puntas: sin esto arranca y frena de golpe, y
      // entonces se ve un numero moviendose, no una particula flotando.
      const k = suyo * suyo * (3 - 2 * suyo);

      if (k > 0) {
        // La vuelta no es en linea recta. Un arco pequeno y distinto para
        // cada una, y lo que seria un enjambre ordenandose pasa a ser gas
        // arrastrado hacia un sitio.
        const arco = k * (1 - k) * 4;

        x += (p.dx - p.bx) * k + Math.sin(d * 1.3) * arco * 0.16;
        y += (p.dy - p.by) * k + Math.cos(d * 1.1) * arco * 0.16;
        z += (p.dz - p.bz) * k;

        // Deshecha ya no es piel, es gas: mas tenue. El brillo de la cara
        // lo daba la luz sobre una superficie, y ahi ya no hay superficie
        // a la que dar.
        alfa *= 1 - k * 0.55;
      }
    }

    if (p.clase === "cara") {
      // La mandibula baja, y con ella todo lo que cuelga de ella.
      y -= estado.apertura * 0.175 * p.mandibula;
      z += estado.apertura * 0.030 * p.mandibula;

      // Los labios: el de arriba apenas se mueve, el de abajo va con la
      // mandibula y ademas se separa.
      y += estado.apertura * 0.022 * p.labioAlto;
      y -= estado.apertura * 0.055 * p.labioBajo;

      // Redondear acerca las comisuras y adelanta los labios.
      const labio = p.labioAlto + p.labioBajo;

      x -= x * estado.redondeo * 0.22 * labio;
      z += estado.redondeo * 0.075 * labio;

      // El hueco de la boca. Apagar estas particulas es lo que se ve como
      // boca abierta: sobre negro, la ausencia de luz *es* la sombra.
      alfa *= 1 - p.interior * Math.min(1, estado.apertura * 2.3);

      // Cejas.
      y += estado.cejas * 0.030 * p.ceja;

      // Parpado: los ojos se cierran hacia su propia linea.
      if (p.ojo > 0.02 && estado.parpadeo > 0) {
        y += (-0.148 - p.by) * estado.parpadeo * p.ojo * 0.9;
        alfa *= 1 - estado.parpadeo * p.ojo * 0.55;
      }
    }

    const rx = x * cosY + z * senY;
    const rz = z * cosY - x * senY;
    const ry = y * cosX - rz * senX;
    const rz2 = rz * cosX + y * senX;

    const hondo = rz2 + CAMARA;

    if (hondo < 0.30 || alfa < 0.012) continue;

    const k = LENTE / hondo;

    visibles.push({
      px: cx + rx * k * escala,
      py: cy - ry * k * escala,
      r: k * p.tam * 1.5,
      z: rz2,
      alfa: alfa,
      indice: p.indice,
      clase: p.clase,
      gas: p.gas,
    });
  }

  visibles.sort(function (a, b) { return a.z - b.z; });

  for (const v of visibles) {
    const frente = Math.min(1, Math.max(0, (v.z + 0.9) / 1.9));

    // Niebla de profundidad: lo de atras se apaga deprisa y la cara se
    // despega del fondo en vez de fundirse con el.
    let alfa = v.alfa * (0.14 + Math.pow(frente, 1.7) * 0.95);

    if (v.gas) alfa *= 0.30;                     // el gas suma poco, muchas veces

    if (alfa < 0.008) continue;

    const radio = v.r * (0.55 + frente * 1.25);

    if (radio < 0.12) continue;

    ctx.globalAlpha = Math.min(1, alfa);

    const luz = v.clase === "estrella" ? ESTRELLA
              : v.clase === "bruma" ? POLVO
              : PALETA[v.indice];

    ctx.drawImage(luz, v.px - radio * 2.2, v.py - radio * 2.2, radio * 4.4, radio * 4.4);
  }

  // El tinte de la fase, multiplicado sobre lo dibujado: sobre negro no
  // se nota, sobre las particulas si. Es un solo rectangulo por fotograma.
  if (estado.tinte.k > 0.01) {
    const c = estado.tinte;

    ctx.globalAlpha = Math.min(1, c.k);
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgb(" + (c.r | 0) + "," + (c.g | 0) + "," + (c.b | 0) + ")";
    ctx.fillRect(0, 0, ancho, alto);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

requestAnimationFrame(fotograma);
</script>
