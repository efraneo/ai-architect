name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run: no point in paying
# for a build whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No test may reach a real provider. If one tries, it fails loudly instead
  # of silently picking up a key from the environment.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
  OPENROUTER_API_KEY: ""

jobs:
  calidad:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (linter)
        run: ruff check .

      - name: Black (format)
        run: black --check .

      - name: Mypy (types)
        run: mypy ai_architect

  tests:
    name: Tests · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing combination must not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Only 3.12 for now: it is the floor declared in pyproject and the one
        # verified locally. Add "3.13" once someone confirms that every
        # dependency supports it -- a matrix that is red on day one teaches
        # people to ignore the CI.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  cobertura:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests with coverage
        run: pytest -q --cov=ai_architect --cov-report=term --cov-report=xml

      - name: Publish the report in the run summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report | tail -n 20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
