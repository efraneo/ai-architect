line-length = 88

target-version = "py312"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]

[lint.per-file-ignores]
"ai_architect/agente/*" = ["UP042"]   # enums str+Enum portados de OpenJarvis
