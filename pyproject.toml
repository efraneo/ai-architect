[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-architect"
version = "0.1.0"
description = "Autonomous AI Software Architect"
readme = "README.md"
requires-python = ">=3.12"

license = { text = "MIT" }

authors = [
    { name = "Efrain", email = "your@email.com" }
]

keywords = [
    "ai",
    "software",
    "architect",
    "llm",
    "autonomous",
    "code-generation",
    "refactoring"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.3.0",
    "GitPython>=3.1",
    "networkx>=3.3",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.8",
    "typer>=0.12",
    "colorama>=0.4",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]

architect = "ai_architect.architect:main"

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

include = ["ai_architect*"]

[tool.black]

line-length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]

testpaths = [
    "tests"
]
