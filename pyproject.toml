[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-architect"
version = "0.1.0"
description = "Autonomous AI Software Architect"
readme = "README.md"
requires-python = ">=3.12"

license = { text = "MIT" }

authors = [
    { name = "Efrain", email = "your@email.com" }
]

keywords = [
    "ai",
    "software",
    "architect",
    "llm",
    "autonomous",
    "code-generation",
    "refactoring"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

# Lo que de verdad se importa. Se comprobo una por una: `numpy`,
# `networkx`, `typer`, `pydantic`, `GitPython`, `rich` y `colorama` no
# aparecen en una sola linea del codigo. Estaban en la lista desde el
# principio y obligaban a descargar cientos de megas para nada.
#
# Git se usa, pero por `subprocess`, no por `GitPython`: es una herramienta
# externa, no una libreria.
dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "pyyaml>=6.0",
]

# Proveedores que no todo el mundo usa. Quien quiera Gemini o un modelo
# local se los instala aparte, y el resto no paga la descarga.
[project.optional-dependencies]

gemini = ["google-generativeai>=0.8.0"]

local = ["ollama>=0.3.0"]

todo = ["google-generativeai>=0.8.0", "ollama>=0.3.0"]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]

architect = "ai_architect.architect:main"

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

include = ["ai_architect*"]

# El rostro es parte del programa, no documentacion. `include-package-data`
# a secas no lo mete: sin MANIFEST.in ni esta lista, setuptools solo empaqueta
# los `.py`. Se comprobo construyendo la rueda — 200 archivos dentro y ningun
# `.html`, o sea que `pip install ai-architect` daba un avatar que no existe.
[tool.setuptools.package-data]

ai_architect = ["avatar/*.html"]

[tool.black]

line-length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]

testpaths = [
    "tests"
]
